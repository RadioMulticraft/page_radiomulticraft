  transition: background-color 0.3s;
  position: relative;
  z-index: 2;
}
#playButton:hover { background-color: #e23030; color: #fff !important; }

/* Glühender Ring, nur aktiv wenn Stream läuft */
#playButton-wrapper::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,59,59,0.55) 0%, rgba(255,59,59,0) 70%);
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
  z-index: 1;
}
#playButton-wrapper.is-playing::before {
  opacity: 1;
  transform: scale(1);
  animation: glowPulse 1.8s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { opacity: 0.55; transform: scale(0.95); }
  50% { opacity: 1; transform: scale(1.15); }
}

/* Mini Audio-Visualizer neben/hinter dem Play-Button */
#visualizer {
  position: absolute;
  left: 50%;

  align-items: flex-end;
  gap: 3px;
  height: 14px;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
#playButton-wrapper.is-playing #visualizer { opacity: 1; }
#visualizer span {
  width: 3px;

  border-radius: 2px;

#playButton-wrapper.is-playing #visualizer span { animation-play-state: running; }

#visualizer span:nth-child(2) { animation-duration: 0.8s; animation-delay: -0.1s; }
#visualizer span:nth-child(3) { animation-duration: 0.5s; animation-delay: -0.6s; }
#visualizer span:nth-child(4) { animation-duration: 0.9s; animation-delay: -0.3s; }
#visualizer span:nth-child(5) { animation-duration: 0.7s; animation-delay: -0.7s; }
@keyframes visBar {

<script>
document.addEventListener("DOMContentLoaded", function() {
    const today = new Date();
    const month = today.getMonth(); // 0 = Januar, 11 = Dezember

    // Schneefall nur 1.–26. Dezember
    const isChristmasSeason = (month === 11 && day >= 1 && day <= 26);
    if (!isChristmasSeason) return; // Skript beenden, wenn nicht Dezember

    function createSnowflake() {
        const snowflake = document.createElement("div");
        snowflake.classList.add("snowflake");
        snowflake.textContent = "❄";

        // Unterschiedliche Fallgeschwindigkeit
        snowflake.style.animationDuration = Math.random() * 4 + 4 + "s";

        document.body.appendChild(snowflake);

        setTimeout(() => snowflake.remove(), 8000);
    }

    // Alle 1500ms neue Schneeflocke

});

<script>
// Audio Player
const streamUrl='https://stream.laut.fm/radioms990';
const playButtonWrapper=document.getElementById('playButton-wrapper');
const playButton=document.getElementById('playButton');
const volumeSlider=document.getElementById('volume');
const currentSongSpan=document.getElementById('current-song');
const currentShowTitle=document.getElementById("current-show-title");
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const sound=new Howl({
  src:[streamUrl],
  html5:true,
  format:['mp3'],
  volume:0.5
});

playButton.addEventListener('click',()=>{sound.playing()?sound.pause():sound.play();});
volumeSlider.addEventListener('input',()=>{sound.volume(volumeSlider.value);});

// Play/Pause immer weiß
sound.on('play', () => {
  playButton.textContent = '⏸';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
  if(!prefersReducedMotion) playButtonWrapper.classList.add('is-playing');
});
sound.on('pause', () => {
  playButton.textContent = '▶';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
  playButtonWrapper.classList.remove('is-playing');
});
sound.on('loaderror', () => {
  playButton.textContent = '▶';
  playButtonWrapper.classList.remove('is-playing');
  const previousShow = currentShowTitle.textContent;
  currentShowTitle.textContent = '⚠ Stream nicht erreichbar';
  setTimeout(() => { currentShowTitle.textContent = previousShow; }, 5000);
});
sound.on('playerror', () => {
  playButton.textContent = '▶';
  playButtonWrapper.classList.remove('is-playing');
  const previousShow = currentShowTitle.textContent;
  currentShowTitle.textContent = '⚠ Verbindung unterbrochen';
  setTimeout(() => { currentShowTitle.textContent = previousShow; }, 5000);
});

// Song Title
async function fetchCurrentSong(retry=false){
try{
const response=await fetch('https://api.laut.fm/station/radioms990/current_song?_='+Date.now());
const data=await response.json();
const artist=data.artist?.name?.trim();
const title=data.title?.trim();
const hasValidArtist=artist && !/^-+$/.test(artist);
if(hasValidArtist && title){currentSongSpan.textContent=`${artist} - ${title}`;}
else if(title){currentSongSpan.textContent=title;}
else{if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Dein Sound | Dein Stream";}}
}catch(e){if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Dein Sound | Dein Stream";}}
}

else if(hour>=18 && hour<21) show="Feierabend Programm";
else if(hour>=21 && hour<24) show="Abendshow";
else if(hour>=0 && hour<6) show="NonStop!";
currentShowTitle.textContent=show;
}
fetchCurrentSong(); setInterval(fetchCurrentSong,3000);

Medienberichten zufolge spielte auch die große Hitze in London eine Rolle. 

Bei Temperaturen von über 30 Grad hatte der Sänger sein Publikum zuvor sogar dazu aufgerufen, 
ausreichend zu trinken und aufeinander zu achten.</p>

<img src="img/TaylorSwift.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>Taylor Swift überrascht Fans bei „Toy Story 5“-Premiere</h2>

<p>Damit hat wohl niemand gerechnet: Bei der Premiere von „Toy Story 5“ in Los Angeles sorgte Popstar Taylor Swift für einen echten Gänsehautmoment. 
Überraschend erschien die Sängerin auf dem roten Teppich – und hatte etwas ganz Besonderes im Gepäck.</p>

<p>Nach der Premiere performte Taylor Swift erstmals live ihren neuen Song „I Knew It, I Knew You“, 
den sie eigens für den neuen „Toy Story“-Film aufgenommen hat. 
Für besonders emotionale Momente sorgte anschließend ihr gemeinsamer Auftritt mit Filmkomponist Randy Newman: 
Zusammen sangen sie den legendären Klassiker „You’ve Got a Friend in Me“ und begeisterten damit Fans der Filmreihe.</p>

<p>Taylor Swift verriet außerdem, dass sie bereits seit ihrer Kindheit großer „Toy Story“-Fan sei. 
Für sie sei es ein lang gehegter Traum gewesen, Musik für die beliebten Figuren beizusteuern.

In Deutschland startet „Toy Story 5“ am 23. Juli in den Kinos.</p>


<!-- MELDUNG C -->


<img src="img/javierdumont-vinyl-4722544.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>KI-Hit sorgt für Diskussionen: „North Wind Calls“ überrascht Musikfans</h2>

<p>Die Grenzen zwischen Mensch und Maschine verschwimmen immer stärker – jetzt offenbar auch in der Musik. 
Mit dem Song „100 %“ sorgt das Projekt North Wind Calls derzeit für Aufmerksamkeit. Der besondere Twist: Hinter dem Titel steckt offenbar künstliche Intelligenz.</p>

<p>Immer häufiger werden Songs mithilfe von KI erstellt – von Melodien über Songtexte bis hin zu Stimmen. 
Während einige Musikfans die technischen Möglichkeiten feiern, sehen Kritiker darin eine Gefahr für echte Künstlerinnen und Künstler. 
Genau diese Debatte wird nun auch rund um „100 %“ geführt.</p>

<p>Musikalisch bewegt sich der Song im modernen Pop-Bereich und klingt für viele Hörer überraschend professionell. 
Ohne Hintergrundwissen würden manche vermutlich gar nicht merken, dass KI bei der Entstehung eine Rolle gespielt haben könnte.

Doch die Entwicklung wirft Fragen auf: Wie viel „echte Kunst“ steckt noch in Musik, wenn Algorithmen kreativ werden? 
Und welche Bedeutung haben Musikerinnen und Musiker künftig in einer Branche, die immer digitaler wird?

Fest steht: KI-Musik ist längst keine Zukunftsvision mehr – sie ist bereits in Playlists, Streams und Diskussionen angekommen. 
Ob sich solche Songs dauerhaft durchsetzen oder eher ein Trend bleiben, wird sich zeigen.</p>


<!-- MELDUNG D -->


<img src="img/Konzert1838653_1280.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>Ariana Grande kündigt neues Album „Petal“ an</h2>

<p>Ariana Grande startet in eine neue Ära: Ihr achtes Studioalbum „Petal“ erscheint am 31. Juli 2026.</p>

<p>Die Sängerin hatte das Projekt bereits zuvor mit Einblicken aus dem Studio angeteast. 
Das Album soll rund 12 Songs umfassen und thematisch für Wachstum, Stärke und Neuanfang stehen.</p>

<p>Besonders spannend: „Petal“ ist ihr erstes Album unter ihrem eigenen Label – sie hat also mehr kreative Kontrolle als je zuvor.

Nach ihrem letzten Album „Eternal Sunshine“ (2024) markiert das neue Projekt ihr großes musikalisches Comeback – parallel zu ihrer erfolgreichen Karriere als Schauspielerin.</p>

function loadPage(page){
  if(prefersReducedMotion){
    content.innerHTML = pages[page];
    window.scrollTo({top:0, behavior:"auto"});
    initScrollReveal();
    return;
  }
  content.style.opacity = 0;
  setTimeout(()=>{
    content.innerHTML = pages[page];
    window.scrollTo({top:0, behavior:"auto"});
    content.style.opacity = 1;
    initScrollReveal();
  }, 180);
}

// Scroll-Reveal: Karten, Banner & Team-Kacheln gleiten beim Scrollen sanft ins Bild
let revealObserver = null;
function initScrollReveal(){
  if(prefersReducedMotion) return;
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('revealed');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  const revealTargets = content.querySelectorAll('.card, .centered-banner, .team-member');
  revealTargets.forEach(el=>{
    el.classList.add('reveal-init');
    revealObserver.observe(el);
  });
}
links.forEach(link=>{link.addEventListener("click",e=>{

  document.querySelector(".sidebar").classList.remove("show");

});});

closeBtn.textContent = '✖';

closeBtn.style.background = 'transparent';

playlistPopup.appendChild(closeBtn);

closeBtn.addEventListener('click', () => {
    playlistOverlay.style.display = 'none';
});

playlistOverlay.addEventListener('click', (e) => {
    if(e.target === playlistOverlay) playlistOverlay.style.display = 'none';
});

async function loadLastSongs() {
    playlistPopup.innerHTML = '<h2 style="color:#ff3b3b; margin-bottom:20px;">Playlist</h2>';
    playlistPopup.appendChild(closeBtn);
    try {
        const res = await fetch('https://api.laut.fm/station/radioms990/last_songs?_=' + Date.now());
        const data = await res.json();

        if (!data || !Array.isArray(data) || data.length === 0) {
            playlistPopup.innerHTML += '<p>Keine Songs verfügbar</p>';
            playlistPopup.appendChild(closeBtn);
            return;
        }

        const songContainer = document.createElement('div');
        songContainer.style.display = 'grid';
        songContainer.style.gridTemplateColumns = '1fr';
        songContainer.style.gap = '12px';

        data.slice(0, 10).forEach(song => {
    const card = document.createElement('div');
    card.style.background = 'rgba(255,59,59,0.1)';
    card.style.padding = '12px 15px';
    card.style.borderRadius = '10px';
    card.style.display = 'flex';
    card.style.alignItems = 'center';
    card.style.transition = 'transform 0.2s, box-shadow 0.2s';
    card.style.cursor = 'default';

    card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-3px)';
        card.style.boxShadow = '0 6px 15px rgba(255,59,59,0.4)';
    });
    card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0)';
        card.style.boxShadow = 'none';
    });

    const songText = document.createElement('span');
    const songArtist = song.artist?.name?.trim();
    const songTitle = song.title?.trim();
    const songHasValidArtist = songArtist && !/^-+$/.test(songArtist);
    songText.textContent = songHasValidArtist && songTitle ? `${songArtist} - ${songTitle}` : (songTitle || 'Dein Sound | Dein Stream');
    songText.style.fontWeight = '600';

    card.appendChild(songText); // Musik-Icon entfernt
    songContainer.appendChild(card);
});

        playlistPopup.appendChild(songContainer);
    } catch (e) {
        playlistPopup.innerHTML += '<p>Fehler beim Laden</p>';
        playlistPopup.appendChild(closeBtn);
    }
}

playlistButton.addEventListener('click', () => {
    playlistOverlay.style.display = 'block';
    loadLastSongs();
});


</script>
