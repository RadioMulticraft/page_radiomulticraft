<style>
.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 1em;
  pointer-events: none;
  z-index: 5000;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0.2;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const today = new Date();
    const month = today.getMonth(); // 0 = Januar, 11 = Dezember
    const day = today.getDate();

    // Schneefall nur 1.–26. Dezember
    const isChristmasSeason = (month === 11 && day >= 1 && day <= 26);
    if (!isChristmasSeason) return; // Skript beenden, wenn nicht Dezember

    function createSnowflake() {
        const snowflake = document.createElement("div");
        snowflake.classList.add("snowflake");
        snowflake.textContent = "❄";

        // Zufällige Startposition und Größe
        const size = Math.random() * 1.2 + 0.6; 
        snowflake.style.left = Math.random() * 100 + "vw";
        snowflake.style.fontSize = size + "rem";

        // Unterschiedliche Fallgeschwindigkeit
        snowflake.style.animationDuration = Math.random() * 4 + 4 + "s";

        document.body.appendChild(snowflake);

        setTimeout(() => snowflake.remove(), 8000);
    }

    // Alle 1500ms neue Schneeflocke
    setInterval(createSnowflake, 1500);
});
</script>

<script>
// Audio Player
const streamUrl='https://stream.laut.fm/radioms990';
const playButton=document.getElementById('playButton');
const volumeSlider=document.getElementById('volume');
const currentSongSpan=document.getElementById('current-song');
const currentShowTitle=document.getElementById("current-show-title");

const sound=new Howl({
  src:[streamUrl],
  html5:true,
  format:['mp3'],
  volume:0.5
});

playButton.addEventListener('click',()=>{sound.playing()?sound.pause():sound.play();});
volumeSlider.addEventListener('input',()=>{sound.volume(volumeSlider.value);});

// Play/Pause immer weiß
sound.on('play', () => {
  playButton.textContent = '⏸';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
});
sound.on('pause', () => {
  playButton.textContent = '▶';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
});

// Song Title
async function fetchCurrentSong(retry=false){
try{
const response=await fetch('https://api.laut.fm/station/radioms990/current_song?_='+Date.now());
const data=await response.json();
if(data.artist?.name && data.title){currentSongSpan.textContent=`${data.artist.name} - ${data.title}`;}
else{if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Kein Titel verfügbar";}}
}catch(e){if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Kein Titel verfügbar";}}
}

// Aktuelle Sendung
function updateCurrentShow(){
const now=new Date(); const hour=now.getHours(); let show="NonStop!";
if(hour>=6 && hour<10) show="Morningshow";
else if(hour>=10 && hour<14) show="Vormittagsprogramm";
else if(hour>=14 && hour<18) show="Nachmittagsshow";
else if(hour>=18 && hour<21) show="Feierabend Programm";
else if(hour>=21 && hour<24) show="Abendshow";
else if(hour>=0 && hour<6) show="NonStop!";
currentShowTitle.textContent=show;
}
fetchCurrentSong(); setInterval(fetchCurrentSong,3000);
updateCurrentShow(); setInterval(updateCurrentShow,60000);

<h1>STARNEWS</h1>


<!-- MELDUNG A -->


<img src="img/eiffel-tower-975004_1920.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>Wird Callum Turner der neue James Bond – und Dua Lipa singt den Titelsong?</h2>

<p>Hollywood brodelt wieder einmal – und dieses Mal geht es um nichts Geringeres als die Zukunft des legendären Geheimagenten 007.</p>

<p>Seit dem Abschied von Daniel Craig warten Fans sehnsüchtig darauf, 
wer als nächstes den berühmten Martini-Schüttler schwingt – und ein Name steht aktuell ganz oben auf der Gerüchte-Liste: Callum Turner.</p>

<p>Der britische Schauspieler, der unter anderem aus Filmen wie Fantastic Beasts und Serien wie Masters of the Air bekannt ist, 
soll laut aktuellen Berichten lautstark in seinem Umfeld behauptet haben, dass er bereits als nächster James Bond engagiert wurde. 
Ein Insider soll gesagt haben: „Er plappert es überall herum … Callum wird der neue Bond – das ist bestätigt.“</p>

<p>Und als ob das noch nicht genug wäre: Dua Lipa, Turners Verlobte und eine der größten Popstars der Welt, 
wird ebenfalls ins Spiel gebracht. Gerüchte behaupten, dass sie den Titelsong für den kommenden Bond-Film beisteuern könnte – genau wie es Adele oder Billie Eilish zuvor getan haben.</p>


<!-- MELDUNG B -->


<img src="img/eiffel-tower-975004_1920.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>„Clooney-Familie jetzt französisch“</h2>

<p>Hollywoodstar George Clooney und seine Familie sind jetzt offiziell französische Staatsbürger.</p>

<p>Der Oscarpreisträger und seine Frau Amal haben sich bewusst für Frankreich entschieden – vor allem wegen eines ruhigeren und bodenständigeren Lebens abseits des Hollywood-Rummels.
Die Familie besitzt bereits seit Jahren ein Anwesen im Süden Frankreichs. Dort schätzen die Clooneys besonders die Privatsphäre, die Gelassenheit und die Möglichkeit, 
ihren Kindern ein möglichst normales Alltagsleben zu ermöglichen – fernab von Paparazzi und rotem Teppich.</p>

<p>Frankreich gilt für viele Prominente als Rückzugsort, und auch George Clooney betont immer wieder, wie sehr ihm das entspannte Lebensgefühl und die Kultur des Landes gefallen.</p>


<!-- MELDUNG C -->


<img src="img/ai-generated-8848753_960_720.jpg" alt="Kino" class="centered-banner" loading="lazy">
<h2>„Das Kanu des Manitu“</h2>

<p>Fast ein Vierteljahrhundert nach dem Kultfilm Der Schuh des Manitu feiert Michael „Bully“ Herbig ein fulminantes Kino-Comeback: „Das Kanu des Manitu“ ist aktuell der erfolgreichste deutsche Kinofilm des Jahres.</p>

<p>Der Film startete Mitte August in den deutschen Kinos und sorgte bereits am ersten Wochenende für ausverkaufte Säle. 
Innerhalb kurzer Zeit strömten mehrere Millionen Zuschauerinnen und Zuschauer in die Kinos – ein Erfolg, mit dem kaum jemand gerechnet hatte. 
Damit lässt Das Kanu des Manitu sogar viele internationale Blockbuster hinter sich.</p>

<p>Inhaltlich knüpft der Film an den bekannten Humor und die beliebten Figuren des Originals an. Abahachi, 
Ranger und ihre Weggefährten erleben ein neues Abenteuer, das bewusst auf Nostalgie setzt, dabei aber auch moderne Elemente einbaut. Genau diese Mischung kommt beim Publikum offenbar hervorragend an.

Filmkritiker sehen den Erfolg als starkes Signal für das deutsche Kino. Der Film zeigt, dass bekannte Stoffe mit Herz, Humor und einer treuen Fanbasis auch heute noch große Menschenmengen ins Kino locken können.

Fazit: „Das Kanu des Manitu“ ist mehr als nur eine Fortsetzung – es ist ein echtes Kinoereignis und beweist, dass deutscher Humor auch 2025 noch Massen begeistert.</p>



<!-- MELDUNG D -->


<img src="img/ChrisRea.png" alt="ChrisRea" class="centered-banner" loading="lazy">
<h2>In Memoriam – Chris Rea (1951 – 2025)</h2>

<p>Mit großer Traurigkeit nehmen wir Abschied von Chris Rea, dem britischen Singer-Songwriter hinter einem der schönsten Weihnachtsklassiker “Driving Home for Christmas”.</p>

<p>Am 22. Dezember 2025 ist Chris Rea im Alter von 74 Jahren nach kurzer Krankheit friedlich im Krankenhaus verstorben, umgeben von seiner Familie.

Seine rauchige Stimme und seine Musik haben Generationen begleitet – von Driving Home for Christmas über The Road to Hell bis hin zu On the Beach. 
Seine Songs bleiben unvergessen und verbinden Menschen auf der ganzen Welt, besonders in dieser besonderen Jahreszeit.

Danke für all die Melodien, die Erinnerungen und die Musik, die uns durch so viele Jahre begleitet haben.</p>

// Playlist Button & Popup
const playlistButton = document.createElement('button');
playlistButton.textContent = 'Playlist';
playlistButton.style.position = 'fixed';
playlistButton.style.top = '5px';
playlistButton.style.right = '20px';
playlistButton.style.zIndex = '1001';

playlistOverlay.style.left = '0';

playlistOverlay.style.height = '100vh';
playlistOverlay.style.backgroundColor = 'rgba(0,0,0,0.6)';
playlistOverlay.style.display = 'none';

const playlistPopup = document.createElement('div');
playlistPopup.style.position = 'absolute';

playlistPopup.style.left = '50%';

playlistPopup.style.backgroundColor = '#1e1e1e';

const closeBtn = document.createElement('button');

    playlistOverlay.style.display = 'none';
});

playlistOverlay.addEventListener('click', (e) => {
    if(e.target === playlistOverlay) playlistOverlay.style.display = 'none';
});

async function loadLastSongs() {
    playlistPopup.innerHTML = '<h2 style="color:#ff3b3b; margin-bottom:20px;">Playlist</h2>';
    playlistPopup.appendChild(closeBtn);
    try {
        const res = await fetch('https://api.laut.fm/station/radioms990/last_songs?_=' + Date.now());
        const data = await res.json();

        if (!data || !Array.isArray(data) || data.length === 0) {
            playlistPopup.innerHTML += '<p>Keine Songs verfügbar</p>';
            playlistPopup.appendChild(closeBtn);
            return;
        }

        const songContainer = document.createElement('div');
        songContainer.style.display = 'grid';
        songContainer.style.gridTemplateColumns = '1fr';
        songContainer.style.gap = '12px';

        data.slice(0, 10).forEach(song => {
    const card = document.createElement('div');
    card.style.background = 'rgba(255,59,59,0.1)';
    card.style.padding = '12px 15px';
    card.style.borderRadius = '10px';
    card.style.display = 'flex';
    card.style.alignItems = 'center';
    card.style.transition = 'transform 0.2s, box-shadow 0.2s';
    card.style.cursor = 'default';

    card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-3px)';
        card.style.boxShadow = '0 6px 15px rgba(255,59,59,0.4)';
    });
    card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0)';
        card.style.boxShadow = 'none';
    });

    const songText = document.createElement('span');
    songText.textContent = `${song.artist?.name || 'Unbekannt'} - ${song.title || 'Unbekannt'}`;
    songText.style.fontWeight = '600';

    card.appendChild(songText); // Musik-Icon entfernt
    songContainer.appendChild(card);
});

        playlistPopup.appendChild(songContainer);
    } catch (e) {
        playlistPopup.innerHTML += '<p>Fehler beim Laden</p>';
        playlistPopup.appendChild(closeBtn);
    }
}

playlistButton.addEventListener('click', () => {
    playlistOverlay.style.display = 'block';
    loadLastSongs();
});


</script>
