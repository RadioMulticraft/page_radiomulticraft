<style>
/* Grund-Reset */
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background-color: #121212;
  color: #f0f0f0;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 220px;
  height: 100vh;
  background-color: #8E0E0E;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  transition: left 0.3s;
  z-index: 1000;
}
.sidebar-logo { margin-bottom: 30px; }
.sidebar-logo img { width: 150px; display: block; }
.sidebar-links-wrapper {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.sidebar-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
  max-width: 160px;
}
.sidebar-links a {
  color: #fff;
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 4px;
  transition: background-color 0.3s;
  text-align: center;
  display: block;
}
.sidebar-links a:hover { background-color: #ff3b3b; color: #121212; }

/* Main content */
main.content {
  margin-left: 220px;
  padding: 20px;
  flex-grow: 1;
  margin-bottom: 100px; /* Abstand zum Player */
  transition: opacity 0.18s ease;
}

/* Scroll-Reveal: sanftes Einblenden beim Scrollen */
.reveal-init {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-init.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* Überschriften */
h1,h2,h3 { text-align: center; color: #fff; }
h1 { font-size: 2.5rem; margin-bottom: 20px; }
h2 { font-size: 1.8rem; margin-bottom: 20px; }
h3 { font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px; }

/* Separator */
.separator { width: 80px; height: 4px; background: #ff3b3b; margin: 40px auto; border-radius: 2px; }

/* Cards */
.card {
  background-color: #1e1e1e;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  max-width: 800px;
  margin: 20px auto;
}
.card h2 { color: #ff3b3b; margin-bottom: 20px; }
.card p { line-height: 1.6; font-size: 1rem; margin-bottom: 12px; }
.card a { color: #ff3b3b; text-decoration: none; }
.card a:hover { text-decoration: underline; }

/* Team grid */
.team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 30px; }
.team-member {
  background: #1e1e1e;
  border-radius: 16px;
  padding: 25px 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.team-member:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.team-member img {
  width: 160px; height: 160px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 4px solid #ff3b3b;
}
.team-member h3 { margin: 10px 0 5px; font-size: 1.3rem; }
.team-member p { margin: 0; font-size: 0.95rem; color: #ccc; }

/* Banner zentrieren */
.centered-banner { display:block; margin: 0 auto 30px; max-width:100%; height:auto; }

/* Werbung Text */
.werbung-text { max-width: 800px; margin: 0 auto 150px; font-size:1.1rem; line-height:1.6; text-align:center; }
.werbung-text a { color: #ff3b3b; text-decoration:none; }

/* Kontakt-Kreise */
.contact-circles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin: 30px 0;
}
.contact-circle {
  width: 60px;
  height: 60px;
  background-color: #8E0E0D;
  color: #fff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  text-decoration: none;
  transition: background-color 0.3s;
  flex-shrink: 0;
}
.contact-circle:hover { background-color: #ff3b3b; }

/* Cover-Bild vor dem Play-Button */
.cover-wrapper {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  overflow: hidden;
  margin-left: 20px;
  margin-right: 18px;
  flex-shrink: 0;
  background: #1e1e1e;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08);
  box-sizing: border-box;
}
.cover-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.25s ease;
}
/* Wenn kein echtes Songcover vorhanden ist, zeigen wir stattdessen
   das Logo formatfüllend (nicht zugeschnitten) auf rotem Markenhintergrund */
.cover-wrapper.is-logo {
  background: #8E0E0E;
  padding: 9px;
}
.cover-wrapper.is-logo img {
  object-fit: contain;
}

/* Player Footer */
footer.player {
  background: linear-gradient(180deg, rgba(46,46,46,0.97), rgba(24,24,24,0.98));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  padding: 20px;
  position: fixed;
  bottom: 0;
  left: 220px;
  right: 0;
  height: 90px;
  box-sizing: border-box;
  box-shadow: 0 -8px 26px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
footer.player::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,59,59,0.75), transparent);
}

/* Player Buttons */
#playButton-wrapper {
  position: relative;
  width: 60px;
  height: 60px;
  flex-shrink: 0;
}
#playButton {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(150deg, #ff5252, #e21f1f);
  color: #fff !important; /* Symbol immer weiß */
  font-size: 28px;
  line-height: 60px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  user-select: none;
  transition: background 0.3s, transform 0.15s;
  position: relative;
  z-index: 2;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.25), 0 4px 12px rgba(255,59,59,0.35);
}
#playButton:active { transform: scale(0.94); }
#playButton:hover { background: linear-gradient(150deg, #ff6a6a, #d31c1c); color: #fff !important; }

/* Dezenter, ruhiger Atem-Puls direkt am Button */
#playButton.is-playing {
  animation: playGlow 2.8s ease-in-out infinite;
}
@keyframes playGlow {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,59,59,0.25), 0 0 6px 1px rgba(255,59,59,0.3); }
  50%     { box-shadow: 0 0 0 5px rgba(255,59,59,0), 0 0 14px 3px rgba(255,59,59,0.55); }
}

/* Deko-Hintergrund hinter dem Button (dezent, ohne eigene Animation) */
#playButton-wrapper::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,59,59,0.25) 0%, rgba(255,59,59,0) 70%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 1;
}
#playButton-wrapper.is-playing::before {
  opacity: 1;
}

/* Mini Audio-Visualizer neben/hinter dem Play-Button */
#visualizer {
  position: absolute;
  left: 50%;
  bottom: -14px;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 14px;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
#playButton-wrapper.is-playing #visualizer { opacity: 1; }
#visualizer span {
  width: 4px;
  height: 4px;
  border-radius: 2px;
  background: #ff5c5c;
  box-shadow: 0 0 4px 1px rgba(255,59,59,0.6);
  animation: visBar 1.1s ease-in-out infinite;
}
#playButton-wrapper.is-playing #visualizer span { animation-play-state: running; }
#visualizer span:nth-child(1) { animation-duration: 0.9s; animation-delay: -0.4s; }
#visualizer span:nth-child(2) { animation-duration: 1.1s; animation-delay: -0.1s; }
#visualizer span:nth-child(3) { animation-duration: 0.8s; animation-delay: -0.6s; }
#visualizer span:nth-child(4) { animation-duration: 1.2s; animation-delay: -0.3s; }
#visualizer span:nth-child(5) { animation-duration: 1.0s; animation-delay: -0.7s; }
@keyframes visBar {
  0%, 100% { height: 3px; }
  50% { height: 14px; }
}

#volume-wrapper {
  display: flex;
  align-items: center;
  margin-left: 20px;
  flex-shrink: 0;
}
.player-secondary { display: contents; }
#volume {
  width:100px;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  height:6px;
  border-radius:3px;
  background: linear-gradient(to right, #ff3b3b 0%, #ff3b3b var(--vol, 50%), rgba(255,255,255,0.25) var(--vol, 50%), rgba(255,255,255,0.25) 100%);
}
#volume::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; border:2px solid #ff3b3b; margin-top:-5px; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
#volume::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; border:2px solid #ff3b3b; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
#volume::-moz-range-track { background: rgba(255,255,255,0.25); height:6px; border-radius:3px; }
#volume::-moz-range-progress { background: #ff3b3b; height:6px; border-radius:3px; }

/* Songtitel: zuverlässiger Lauftext, der sich per JS an die Textlänge anpasst.
   Läuft nur, wenn der Titel tatsächlich zu lang für das Feld ist – sonst steht er still. */
.song-info { flex-grow:1; overflow:hidden; position: relative; min-width: 0; }
.song-info.has-fade {
  mask-image: linear-gradient(to right, transparent 0, black 22px, black calc(100% - 22px), transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 22px, black calc(100% - 22px), transparent 100%);
}
.marquee-track {
  display: flex;
  align-items: center;
  white-space: nowrap;
  width: max-content;
  will-change: transform;
}
.marquee-track.scrolling {
  animation-name: marqueeScroll;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.marquee-track:not(.scrolling) .marquee-item:first-child {
  text-overflow: ellipsis;
}
.marquee-item {
  font-size: 1.2rem;
  font-weight: 730;
  padding-right: 48px;
  box-sizing: border-box;
}
.marquee-clone { display: none; }
.marquee-track.scrolling .marquee-clone { display: inline-block; }
@keyframes marqueeScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.volume-icon { color:#fff; margin-right:8px; font-size:20px; flex-shrink: 0; cursor: pointer; }

/* Aktuelle Sendung Fenster im Player */
#current-show {
  margin-left: 20px;
  margin-right: 20px;
  background: rgba(30,30,30,0.85);
  backdrop-filter: blur(6px);
  color: #ff3b3b;
  padding: 12px 18px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  font-size: 0.95rem;
  min-width: 180px;
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  flex-shrink: 0;
}
#current-show:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
#current-show h4 { margin: 6px 0; font-size: 1rem; color: #fff; }
#current-show p { margin: 0; font-weight: 700; font-size: 1rem; color: #ff3b3b; }

/* ON AIR Label */
.on-air {
  display: inline-block;
  background: #ff1a1a;
  color: #fff;
  font-weight: bold;
  font-size: 0.85rem;
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 6px;
  animation: pulse 1.5s infinite;
  letter-spacing: 1px;
}
@keyframes pulse { 0%{box-shadow:0 0 5px rgba(255,0,0,0.7);}50%{box-shadow:0 0 20px rgba(255,0,0,1);}100%{box-shadow:0 0 5px rgba(255,0,0,0.7);} }

/* Hamburger Button nur mobil */
#hamburger { display: none; }
@media (max-width:768px){
  #hamburger {
    display: block;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1001;
    background: #8E0E0E;
    color: #fff;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 20px;
    cursor: pointer;
  }
  .sidebar { left:-250px; width:250px; }
  .sidebar.show { left:0; }
  main.content { margin-left:0; padding:15px; padding-top: 68px; margin-bottom: 134px; }

  h1 { font-size: 1.9rem; margin-bottom: 14px; }
  h2 { font-size: 1.4rem; margin-bottom: 14px; }
  h3 { font-size: 0.95rem; line-height: 1.5; margin-bottom: 26px; }

  .contact-circles { gap: 14px; margin: 24px 0; }
  .contact-circle { width: 52px; height: 52px; font-size: 22px; }

  /* === Player: eine kompakte, aufgeräumte Zeile statt zwei unruhiger Reihen ===
     Aufbau als Grid: Cover | Titel + Sendung (übereinander) | Lautstärke | Play
     Die Lautstärke bekommt auf Mobil nur einen Icon-Toggle (stumm/an), da ein
     Schieberegler auf so wenig Breite ohnehin kaum präzise bedienbar ist und
     Lautstärke auf dem Handy ganz natürlich über die Hardware-Tasten läuft. */
  footer.player {
    left:0; right:0;
    height: auto;
    display: grid;
    grid-template-columns: 52px 46px 1fr;
    grid-template-rows: auto auto;
    align-items: center;
    column-gap: 12px;
    row-gap: 1px;
    padding: 11px 14px calc(11px + env(safe-area-inset-bottom, 0px));
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.4);
  }

  .player-secondary { display: contents; }

  /* Play/Pause: ganz links, zuerst greifbar */
  #playButton-wrapper {
    grid-column: 1;
    grid-row: 1 / 3;
    width: 52px;
    height: 52px;
    justify-self: center;
  }
  #playButton { width:52px; height:52px; font-size:22px; line-height:52px; }

  /* Lautstärke entfällt auf Mobil komplett – Pegel läuft über die Hardware-Tasten */
  #volume-wrapper { display: none; }

  /* Cover: direkt neben dem Play-Button, über beide Zeilen, mit Leuchtring beim Abspielen */
  .cover-wrapper {
    grid-column: 2;
    grid-row: 1 / 3;
    width: 46px;
    height: 46px;
    margin: 0;
    border-radius: 11px;
    transition: box-shadow 0.3s ease;
  }
  .cover-wrapper.is-logo { padding: 6px; }
  footer.player.is-playing .cover-wrapper {
    box-shadow: 0 0 0 2px rgba(255,59,59,0.55), 0 4px 14px rgba(0,0,0,0.5);
  }

  /* Songtitel: obere Zeile der rechten Spalte */
  .song-info {
    grid-column: 3;
    grid-row: 1;
    margin: 0;
    align-self: end;
    min-width: 0;
    width: 100%;
  }
  .song-info.has-fade {
    mask-image: linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
  }
  .marquee-item { font-size: 0.98rem; font-weight: 700; padding-right: 32px; }

  /* Aktuelle Sendung: untere Zeile der rechten Spalte, als schlankes Label */
  #current-show {
    grid-column: 3;
    grid-row: 2;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    min-width: 0;
    max-width: none;
    background: none;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    border-radius: 0;
    text-align: left;
    align-self: start;
  }
  #current-show:hover { transform: none; box-shadow: none; }
  #current-show h4 { display: none; }
  #current-show .on-air {
    width: 6px;
    height: 6px;
    padding: 0;
    margin-bottom: 0;
    border-radius: 50%;
    overflow: hidden;
    text-indent: -999px;
    flex-shrink: 0;
    background: #ff3b3b;
    box-shadow: 0 0 6px 1px rgba(255,59,59,0.7);
  }
  #current-show p {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #c9c9c9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
  }

  /* Der Mini-Visualizer (Punkte unter dem Button) braucht auf Mobil zu viel Platz */
  #visualizer { display: none; }

  .team-grid { grid-template-columns:1fr; gap:20px; }
  .card { padding:20px; margin:15px auto; }
}

@media (max-width: 360px) {
  .contact-circle { width: 46px; height: 46px; font-size: 19px; }
  footer.player { grid-template-columns: 48px 42px 1fr; column-gap: 9px; }
  .cover-wrapper { width: 42px; height: 42px; }
  .marquee-item { font-size: 0.9rem; }
  #current-show p { font-size: 0.7rem; }
  #playButton-wrapper { width: 48px; height: 48px; }
  #playButton { width: 48px; height: 48px; font-size: 20px; line-height: 48px; }
}

/* Reduzierte Bewegung respektieren */
@media (prefers-reduced-motion: reduce) {
  *:not(.marquee-track):not(.marquee-track *), *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .reveal-init { opacity: 1 !important; transform: none !important; }
}
</style>

<!-- ❄ Schneefall-Effekt nur im Dezember -->
<style>
.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 1em;
  pointer-events: none;
  z-index: 5000;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0.2;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const today = new Date();
    const month = today.getMonth(); // 0 = Januar, 11 = Dezember
    const day = today.getDate();

    // Schneefall nur 1.–26. Dezember
    const isChristmasSeason = (month === 11 && day >= 1 && day <= 26);
    if (!isChristmasSeason) return; // Skript beenden, wenn nicht Dezember

    function createSnowflake() {
        const snowflake = document.createElement("div");
        snowflake.classList.add("snowflake");
        snowflake.textContent = "❄";

        // Zufällige Startposition und Größe
        const size = Math.random() * 1.2 + 0.6; 
        snowflake.style.left = Math.random() * 100 + "vw";
        snowflake.style.fontSize = size + "rem";

        // Unterschiedliche Fallgeschwindigkeit
        snowflake.style.animationDuration = Math.random() * 4 + 4 + "s";

        document.body.appendChild(snowflake);

        setTimeout(() => snowflake.remove(), 8000);
    }

    // Alle 1500ms neue Schneeflocke
    setInterval(createSnowflake, 1500);
});
</script>

      <div id="visualizer" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div id="volume-wrapper">
      <i class="fas fa-volume-up volume-icon" id="volumeIcon" role="button" tabindex="0" aria-label="Stumm schalten"></i>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" aria-label="Lautstärke" />
    </div>
  </div>
  <div class="cover-wrapper is-logo">
    <img id="cover-image" src="img/RMC20250918-2.png" alt="Cover" onerror="this.onerror=null;this.src='img/RMC20250918-2.png';this.closest('.cover-wrapper').classList.add('is-logo');">
  </div>
  <div class="song-info">
    <div class="marquee-track" id="marqueeTrack">
      <span class="marquee-item" id="current-song">Lade Titel...</span>
      <span class="marquee-item marquee-clone" id="current-song-clone" aria-hidden="true"></span>
    </div>
  </div>
  <div id="current-show">
    <div class="on-air">● ON AIR</div>
    <h4>Aktuelle Sendung</h4>
    <p id="current-show-title">Lade...</p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

<script>
// Audio Player
const streamUrl='https://stream.laut.fm/radioms990';
const playButtonWrapper=document.getElementById('playButton-wrapper');
const playButton=document.getElementById('playButton');
const volumeSlider=document.getElementById('volume');
const currentSongSpan=document.getElementById('current-song');
const currentSongClone=document.getElementById('current-song-clone');
const marqueeTrack=document.getElementById('marqueeTrack');
const songInfoBox=document.querySelector('.song-info');
const currentShowTitle=document.getElementById("current-show-title");
const coverImage=document.getElementById('cover-image');
const coverWrapper=document.querySelector('.cover-wrapper');
const logoFallback='img/RMC20250918-2.png';
let lastSongKey='';
let lastMarqueeText='';
let coverRequestId=0;

function setCoverImage(url, isLogo){
  coverImage.src = url;
  coverWrapper.classList.toggle('is-logo', !!isLogo);
}

// Sucht bei iTunes ein Coverbild anhand von Interpret + Titel,
// falls laut.fm selbst kein Bild liefert.
async function resolveCoverViaItunes(artist, title){
  const myRequestId = ++coverRequestId;
  try{
    const query = encodeURIComponent(`${artist||''} ${title||''}`.trim());
    if(!query){ if(myRequestId===coverRequestId) setCoverImage(logoFallback, true); return; }
    const res = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&limit=1`);
    const json = await res.json();
    const artwork = json.results?.[0]?.artworkUrl100;
    if(myRequestId!==coverRequestId) return; // Song hat sich in der Zwischenzeit schon wieder geändert
    if(artwork){
      setCoverImage(artwork.replace('100x100bb','600x600bb'), false);
    } else {
      setCoverImage(logoFallback, true);
    }
  }catch(e){
    if(myRequestId===coverRequestId) setCoverImage(logoFallback, true);
  }
}

function updateCoverForSong(artist, title, lautfmImage){
  coverRequestId++; // laufende iTunes-Anfragen für den alten Song verwerfen
  if(lautfmImage){
    setCoverImage(lautfmImage, false);
    return;
  }
  if(!artist && !title){
    setCoverImage(logoFallback, true);
    return;
  }
  resolveCoverViaItunes(artist, title);
}
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Lauftext für den Songtitel: läuft nur, wenn der Titel wirklich zu lang für
// das Feld ist, und dessen Geschwindigkeit sich an die Textlänge anpasst,
// damit auch sehr lange Titel vollständig lesbar durchlaufen.
const MARQUEE_SPEED_PX_PER_SEC = 55;
const MARQUEE_MIN_DURATION = 6;
let marqueeResizeTimeout = null;

function updateMarqueeState(){
  marqueeTrack.classList.remove('scrolling');
  marqueeTrack.style.animationDuration = '';
  songInfoBox.classList.remove('has-fade');
  currentSongClone.textContent = currentSongSpan.textContent;

  // Doppeltes rAF: erst nach dem zweiten Frame ist das Grid-Layout
  // (v.a. die 1fr-Spalte im mobilen Player) garantiert final berechnet,
  // sonst wird auf Mobil teils gegen eine noch nicht fertige Breite gemessen.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const itemWidth = currentSongSpan.scrollWidth;
      const containerWidth = songInfoBox.clientWidth;
      // Die Songtitel-Laufschrift läuft bewusst unabhängig von der
      // "Bewegung reduzieren"-Einstellung, damit jeder Nutzer den vollständigen
      // Titel sehen kann, egal auf welchem Gerät/Browser er unterwegs ist.
      if(itemWidth > containerWidth){
        const duration = Math.max(itemWidth / MARQUEE_SPEED_PX_PER_SEC, MARQUEE_MIN_DURATION);
        marqueeTrack.style.animationDuration = duration + 's';
        marqueeTrack.classList.add('scrolling');
        songInfoBox.classList.add('has-fade');
      }
    });
  });
}

const marqueeObserver = new ResizeObserver(() => {
  clearTimeout(marqueeResizeTimeout);
  marqueeResizeTimeout = setTimeout(updateMarqueeState, 150);
});
marqueeObserver.observe(songInfoBox);

// Nach dem Laden der Schrift erneut prüfen, da sich Textbreiten dadurch
// nachträglich verschieben können (relevant für die Lauftext-Berechnung).
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateMarqueeState);
}

const sound=new Howl({
  src:[streamUrl],
  html5:true,
  format:['mp3'],
  volume:0.5
});

playButton.addEventListener('click',()=>{sound.playing()?sound.pause():sound.play();});
function syncVolumeFill(){ volumeSlider.style.setProperty('--vol', (volumeSlider.value*100)+'%'); }
volumeSlider.addEventListener('input',()=>{sound.volume(volumeSlider.value); syncVolumeFill(); syncVolumeIcon();});
syncVolumeFill();

// Lautstärke-Icon: auf Mobil ersetzt es den Schieberegler als kompakter
// Stumm/An-Schalter, auf Desktop zeigt es zusätzlich den aktuellen Pegel an.
const volumeIcon = document.getElementById('volumeIcon');
let lastVolume = parseFloat(volumeSlider.value) || 0.5;
function syncVolumeIcon(){
  const vol = parseFloat(volumeSlider.value);
  volumeIcon.classList.toggle('is-muted', vol <= 0);
  volumeIcon.classList.remove('fa-volume-up','fa-volume-down','fa-volume-mute');
  if(vol <= 0) volumeIcon.classList.add('fa-volume-mute');
  else if(vol < 0.5) volumeIcon.classList.add('fa-volume-down');
  else volumeIcon.classList.add('fa-volume-up');
}
function toggleMute(){
  const vol = parseFloat(volumeSlider.value);
  if(vol > 0){
    lastVolume = vol;
    volumeSlider.value = 0;
  } else {
    volumeSlider.value = lastVolume > 0 ? lastVolume : 0.5;
  }
  sound.volume(parseFloat(volumeSlider.value));
  syncVolumeFill();
  syncVolumeIcon();
}
volumeIcon.addEventListener('click', toggleMute);
volumeIcon.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleMute(); }
});
syncVolumeIcon();

// Play/Pause immer weiß
const footerPlayer = document.querySelector('footer.player');
sound.on('play', () => {
  playButton.textContent = '⏸';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
  playButton.classList.add('is-playing');
  playButtonWrapper.classList.add('is-playing');
  footerPlayer.classList.add('is-playing');
});
sound.on('pause', () => {
  playButton.textContent = '▶';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
  playButton.classList.remove('is-playing');
  playButtonWrapper.classList.remove('is-playing');
  footerPlayer.classList.remove('is-playing');
});
sound.on('loaderror', () => {
  playButton.textContent = '▶';
  playButton.classList.remove('is-playing');
  playButtonWrapper.classList.remove('is-playing');
  const previousShow = currentShowTitle.textContent;
  currentShowTitle.textContent = '⚠ Stream nicht erreichbar';
  setTimeout(() => { currentShowTitle.textContent = previousShow; }, 5000);
});
sound.on('playerror', () => {
  playButton.textContent = '▶';
  playButton.classList.remove('is-playing');
  playButtonWrapper.classList.remove('is-playing');
  const previousShow = currentShowTitle.textContent;
  currentShowTitle.textContent = '⚠ Verbindung unterbrochen';
  setTimeout(() => { currentShowTitle.textContent = previousShow; }, 5000);
});

// Song Title
async function fetchCurrentSong(retry=false){
try{
const response=await fetch('https://api.laut.fm/station/radioms990/current_song?_='+Date.now());
const data=await response.json();
const artist=data.artist?.name?.trim();
const title=data.title?.trim();
const hasValidArtist=artist && !/^-+$/.test(artist);
if(hasValidArtist && title){currentSongSpan.textContent=`${artist} - ${title}`;}
else if(title){currentSongSpan.textContent=title;}
else{if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Dein Sound | Dein Stream";}}
// Die Laufschrift nur neu starten, wenn sich der Titeltext wirklich geändert hat –
// sonst würde sie bei jeder Abfrage (alle 3s) neu von vorne beginnen und käme
// bei langen Titeln nie sichtbar zum Durchlaufen.
if(currentSongSpan.textContent !== lastMarqueeText){
  lastMarqueeText = currentSongSpan.textContent;
  updateMarqueeState();
}

// Cover nur aktualisieren, wenn sich der Song tatsächlich geändert hat
const songKey = `${hasValidArtist?artist:''}|${title||''}`;
if(songKey !== lastSongKey && (hasValidArtist || title)){
  lastSongKey = songKey;
  const lautfmImage = data.artist?.image || data.artist?.thumb;
  updateCoverForSong(hasValidArtist?artist:null, title, lautfmImage);
}
}catch(e){
  setCoverImage(logoFallback, true);
  if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Dein Sound | Dein Stream";}
  if(currentSongSpan.textContent !== lastMarqueeText){
    lastMarqueeText = currentSongSpan.textContent;
    updateMarqueeState();
  }
}
}

// Aktuelle Sendung
function updateCurrentShow(){
const now=new Date(); const hour=now.getHours(); let show="NonStop!";
if(hour>=6 && hour<8) show="Frühsport";
else if(hour>=8 && hour<11) show="Morningshow";
else if(hour>=11 && hour<15) show="Vormittagsprogramm";
else if(hour>=15 && hour<19) show="Nachmittagsshow";
else if(hour>=19 && hour<22) show="Feierabend Programm";
else if(hour>=22 && hour<24) show="Abendshow";
else if(hour>=0 && hour<6) show="NonStop!";
currentShowTitle.textContent=show;
}
fetchCurrentSong(); setInterval(fetchCurrentSong,3000);
updateMarqueeState();
updateCurrentShow(); setInterval(updateCurrentShow,60000);

const content=document.getElementById("main-content");
const links=document.querySelectorAll("[data-link]");

<img src="img/BTS.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>BTS begeistern München – und singen auf Deutsch</h2>

<p>Sieben Jahre mussten deutsche Fans warten – jetzt waren die K-Pop-Superstars BTS endlich wieder in Deutschland. 
Bei ihren beiden Konzerten in der Münchner Allianz Arena sorgten sie für Gänsehautmomente vor zehntausenden Fans.</p>

<p>Ein Highlight gab es ganz am Ende der Show: 
Die Band stimmte gemeinsam mit dem Publikum den deutschen Hit „Gut genug“ von KitschKrieg, Blumengarten und Shirin David an – auf Deutsch. 
Besonders Jung Kook überraschte die Fans mit der deutschen Hook, die die rund 70.000 Besucher begeistert mitsangen. 
Der Moment verbreitet sich seitdem rasant in den sozialen Netzwerken.</p>

<p>Auch abseits der Bühne zeigte sich BTS begeistert von München: 
Die Band besuchte das Hofbräuhaus, probierte bayerische Spezialitäten und bedankte sich immer wieder mit deutschen Worten bei ihren Fans.

<img src="img/Konzert1838653_1280.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>Schreckmoment bei Harry-Styles-Konzert in London</h2>

<p>Fans von Harry Styles haben am Wochenende einen kurzen Schockmoment erlebt: 
Während seines Konzerts im Londoner Wembley-Stadion ging der Sänger plötzlich auf der Bühne zu Boden.</p>

<p>Videos in den sozialen Medien zeigen, wie sich der 32-Jährige offenbar an einem Schluck Wasser verschluckt. 
Kurz darauf legt er sich auf den Bühnenboden und ringt für einige Sekunden nach Luft. 
Viele Zuschauer machten sich sofort Sorgen um den Musiker.</p>

<p>Entwarnung folgte jedoch schnell: Harry Styles erholte sich nach wenigen Augenblicken, 
stand wieder auf und verabschiedete sich unter dem Applaus der Fans. 
Medienberichten zufolge spielte auch die große Hitze in London eine Rolle.

ausreichend zu trinken und aufeinander zu achten.</p

<p>Nach der Premiere performte Taylor Swift erstmals live ihren neuen Song „I Knew It, I Knew You“, 
den sie eigens für den neuen „Toy Story“-Film aufgenommen hat. 
Für besonders emotionale Momente sorgte anschließend ihr gemeinsamer Auftritt mit Filmkomponist Randy Newman:

<p>Taylor Swift verriet außerdem, dass sie bereits seit ihrer Kindheit großer „Toy Story“-Fan sei.

<img src="img/javierdumont-vinyl-4722544.jpg" alt="News" class="centered-banner" loading="lazy">
<h2>KI-Hit sorgt für Diskussionen: „North Wind Calls“ überrascht Musikfans</h2>

<p>Die Grenzen zwischen Mensch und Maschine verschwimmen immer stärker – jetzt offenbar auch in der Musik. 
Mit dem Song „100 %“ sorgt das Projekt North Wind Calls derzeit für Aufmerksamkeit. Der besondere Twist: Hinter dem Titel steckt offenbar künstliche Intelligenz.</p>

<p>Immer häufiger werden Songs mithilfe von KI erstellt – von Melodien über Songtexte bis hin zu Stimmen. 
Während einige Musikfans die technischen Möglichkeiten feiern, sehen Kritiker darin eine Gefahr für echte Künstlerinnen und Künstler. 
Genau diese Debatte wird nun auch rund um „100 %“ geführt.</p>

<p>Musikalisch bewegt sich der Song im modernen Pop-Bereich und klingt für viele Hörer überraschend professionell. 
Ohne Hintergrundwissen würden manche vermutlich gar nicht merken, dass KI bei der Entstehung eine Rolle gespielt haben könnte.

Doch die Entwicklung wirft Fragen auf: Wie viel „echte Kunst“ steckt noch in Musik, wenn Algorithmen kreativ werden? 
Und welche Bedeutung haben Musikerinnen und Musiker künftig in einer Branche, die immer digitaler wird?

Fest steht: KI-Musik ist längst keine Zukunftsvision mehr – sie ist bereits in Playlists, Streams und Diskussionen angekommen. 
Ob sich solche Songs dauerhaft durchsetzen oder eher ein Trend bleiben, wird sich zeigen.</p>

function loadPage(page){
  if(prefersReducedMotion){
    content.innerHTML = pages[page];
    window.scrollTo({top:0, behavior:"auto"});
    initScrollReveal();
    return;
  }
  content.style.opacity = 0;
  setTimeout(()=>{
    content.innerHTML = pages[page];
    window.scrollTo({top:0, behavior:"auto"});
    content.style.opacity = 1;
    initScrollReveal();
  }, 180);
}

// Scroll-Reveal: Karten, Banner & Team-Kacheln gleiten beim Scrollen sanft ins Bild
let revealObserver = null;
function initScrollReveal(){
  if(prefersReducedMotion) return;
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('revealed');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  const revealTargets = content.querySelectorAll('.card, .centered-banner, .team-member');
  revealTargets.forEach(el=>{
    el.classList.add('reveal-init');
    revealObserver.observe(el);
  });
}

});});

async function loadLastSongs() {
    playlistPopup.innerHTML = '<h2 style="color:#ff3b3b; margin-bottom:20px;">Playlist</h2>';
    playlistPopup.appendChild(closeBtn);
    try {
        const res = await fetch('https://api.laut.fm/station/radioms990/last_songs?_=' + Date.now());
        const data = await res.json();

        if (!data || !Array.isArray(data) || data.length === 0) {
            playlistPopup.innerHTML += '<p>Keine Songs verfügbar</p>';
            playlistPopup.appendChild(closeBtn);
            return;
        }

        const songContainer = document.createElement('div');
        songContainer.style.display = 'grid';
        songContainer.style.gridTemplateColumns = '1fr';
        songContainer.style.gap = '12px';

        data.slice(0, 10).forEach(song => {
    const card = document.createElement('div');
    card.style.background = 'rgba(255,59,59,0.1)';
    card.style.padding = '12px 15px';
    card.style.borderRadius = '10px';
    card.style.display = 'flex';
    card.style.alignItems = 'center';
    card.style.transition = 'transform 0.2s, box-shadow 0.2s';
    card.style.cursor = 'default';

    card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-3px)';
        card.style.boxShadow = '0 6px 15px rgba(255,59,59,0.4)';
    });
    card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0)';
        card.style.boxShadow = 'none';
    });

    const songText = document.createElement('span');
    const songArtist = song.artist?.name?.trim();
    const songTitle = song.title?.trim();
    const songHasValidArtist = songArtist && !/^-+$/.test(songArtist);
    songText.textContent = songHasValidArtist && songTitle ? `${songArtist} - ${songTitle}` : (songTitle || 'Dein Sound | Dein Stream');
    songText.style.fontWeight = '600';

    card.appendChild(songText); // Musik-Icon entfernt
    songContainer.appendChild(card);
});

        playlistPopup.appendChild(songContainer);
    } catch (e) {
        playlistPopup.innerHTML += '<p>Fehler beim Laden</p>';
        playlistPopup.appendChild(closeBtn);
    }
}

playlistButton.addEventListener('click', () => {
    playlistOverlay.style.display = 'block';
    loadLastSongs();
});
