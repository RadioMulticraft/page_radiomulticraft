<style>
/* Grund-Reset */
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background-color: #121212;
  color: #f0f0f0;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 220px;
  height: 100vh;
  background-color: #8E0E0E;
  padding: 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  transition: left 0.3s;
  z-index: 1000;
}
.sidebar-logo { margin-bottom: 30px; }
.sidebar-logo img { width: 150px; display: block; }
.sidebar-links-wrapper {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.sidebar-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
  max-width: 160px;
}
.sidebar-links a {
  color: #fff;
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 4px;
  transition: background-color 0.3s;
  text-align: center;
  display: block;
}
.sidebar-links a:hover { background-color: #ff3b3b; color: #121212; }

/* Main content */
main.content {
  margin-left: 220px;
  padding: 20px;
  flex-grow: 1;
  margin-bottom: 100px; /* Abstand zum Player */
  transition: opacity 0.18s ease;
}

/* Scroll-Reveal: sanftes Einblenden beim Scrollen */
.reveal-init {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-init.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* Überschriften */
h1,h2,h3 { text-align: center; color: #fff; }
h1 { font-size: 2.5rem; margin-bottom: 20px; }
h2 { font-size: 1.8rem; margin-bottom: 20px; }
h3 { font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px; }

/* Separator */
.separator { width: 80px; height: 4px; background: #ff3b3b; margin: 40px auto; border-radius: 2px; }

/* Cards */
.card {
  background-color: #1e1e1e;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  max-width: 800px;
  margin: 20px auto;
}
.card h2 { color: #ff3b3b; margin-bottom: 20px; }
.card p { line-height: 1.6; font-size: 1rem; margin-bottom: 12px; }
.card a { color: #ff3b3b; text-decoration: none; }
.card a:hover { text-decoration: underline; }

/* Starnews: einzelne Meldungen visuell trennen und strukturieren.
   Die Meldungen selbst stehen nicht mehr im HTML, sondern werden zur
   Laufzeit aus news.json geladen (siehe loadStarnews() im Script unten).
   Bearbeitet werden sie über news-editor.html, nicht mehr hier im Code. */
.news-article {
  text-align: left;
  margin-bottom: 45px;
  padding-bottom: 35px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.news-article:last-of-type {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}
.news-article h2 { text-align: left; margin-top: 0; }
.news-article .centered-banner { margin-bottom: 18px; border-radius: 10px; }


/* Team grid */
.team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 30px; }
.team-member {
  background: #1e1e1e;
  border-radius: 16px;
  padding: 25px 15px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.team-member:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.team-member img {
  width: 160px; height: 160px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 4px solid #ff3b3b;
}
.team-member h3 { margin: 10px 0 5px; font-size: 1.3rem; }
.team-member p { margin: 0; font-size: 0.95rem; color: #ccc; }

/* Banner zentrieren */
.centered-banner { display:block; margin: 0 auto 30px; max-width:100%; height:auto; }

/* Werbung Text */
.werbung-text { max-width: 800px; margin: 0 auto 150px; font-size:1.1rem; line-height:1.6; text-align:center; }
.werbung-text a { color: #ff3b3b; text-decoration:none; }

/* Kontakt-Kreise */
.contact-circles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin: 30px 0;
}
.contact-circle {
  width: 60px;
  height: 60px;
  background-color: #8E0E0D;
  color: #fff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  text-decoration: none;
  transition: background-color 0.3s;
  flex-shrink: 0;
}
.contact-circle:hover { background-color: #ff3b3b; }

/* Cover-Bild vor dem Play-Button */
.cover-wrapper {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  overflow: hidden;
  margin-left: 20px;
  margin-right: 18px;
  flex-shrink: 0;
  background: #1e1e1e;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08);
  box-sizing: border-box;
}
.cover-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.25s ease;
}
/* Wenn kein echtes Songcover vorhanden ist, zeigen wir stattdessen
   das Logo formatfüllend (nicht zugeschnitten) auf rotem Markenhintergrund */
.cover-wrapper.is-logo {
  background: #8E0E0E;
  padding: 9px;
}
.cover-wrapper.is-logo img {
  object-fit: contain;
}

/* Player Footer */
footer.player {
  background: linear-gradient(180deg, rgba(46,46,46,0.97), rgba(24,24,24,0.98));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  padding: 20px;
  position: fixed;
  bottom: 0;
  left: 220px;
  right: 0;
  height: 90px;
  box-sizing: border-box;
  box-shadow: 0 -8px 26px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
footer.player::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,59,59,0.75), transparent);
}

/* Player Buttons */
#playButton-wrapper {
  position: relative;
  width: 60px;
  height: 60px;
  flex-shrink: 0;
}
#playButton {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(150deg, #ff5252, #e21f1f);
  color: #fff !important; /* Symbol immer weiß */
  font-size: 28px;
  line-height: 60px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  user-select: none;
  transition: background 0.3s, transform 0.15s;
  position: relative;
  z-index: 2;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.25), 0 4px 12px rgba(255,59,59,0.35);
}
#playButton:active { transform: scale(0.94); }
#playButton:hover { background: linear-gradient(150deg, #ff6a6a, #d31c1c); color: #fff !important; }

/* Dezenter, ruhiger Atem-Puls direkt am Button */
#playButton.is-playing {
  animation: playGlow 2.8s ease-in-out infinite;
}
@keyframes playGlow {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,59,59,0.25), 0 0 6px 1px rgba(255,59,59,0.3); }
  50%     { box-shadow: 0 0 0 5px rgba(255,59,59,0), 0 0 14px 3px rgba(255,59,59,0.55); }
}

/* Deko-Hintergrund hinter dem Button (dezent, ohne eigene Animation) */
#playButton-wrapper::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,59,59,0.25) 0%, rgba(255,59,59,0) 70%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 1;
}
#playButton-wrapper.is-playing::before {
  opacity: 1;
}

/* Mini Audio-Visualizer neben/hinter dem Play-Button */
#visualizer {
  position: absolute;
  left: 50%;
  bottom: -14px;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 14px;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
#playButton-wrapper.is-playing #visualizer { opacity: 1; }
#visualizer span {
  width: 4px;
  height: 4px;
  border-radius: 2px;
  background: #ff5c5c;
  box-shadow: 0 0 4px 1px rgba(255,59,59,0.6);
  animation: visBar 1.1s ease-in-out infinite;
}
#playButton-wrapper.is-playing #visualizer span { animation-play-state: running; }
#visualizer span:nth-child(1) { animation-duration: 0.9s; animation-delay: -0.4s; }
#visualizer span:nth-child(2) { animation-duration: 1.1s; animation-delay: -0.1s; }
#visualizer span:nth-child(3) { animation-duration: 0.8s; animation-delay: -0.6s; }
#visualizer span:nth-child(4) { animation-duration: 1.2s; animation-delay: -0.3s; }
#visualizer span:nth-child(5) { animation-duration: 1.0s; animation-delay: -0.7s; }
@keyframes visBar {
  0%, 100% { height: 3px; }
  50% { height: 14px; }
}

#volume-wrapper {
  display: flex;
  align-items: center;
  margin-left: 20px;
  flex-shrink: 0;
}
.player-secondary { display: contents; }
#volume {
  width:100px;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  height:6px;
  border-radius:3px;
  background: linear-gradient(to right, #ff3b3b 0%, #ff3b3b var(--vol, 50%), rgba(255,255,255,0.25) var(--vol, 50%), rgba(255,255,255,0.25) 100%);
}
#volume::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; border:2px solid #ff3b3b; margin-top:-5px; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
#volume::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#fff; cursor:pointer; border:2px solid #ff3b3b; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
#volume::-moz-range-track { background: rgba(255,255,255,0.25); height:6px; border-radius:3px; }
#volume::-moz-range-progress { background: #ff3b3b; height:6px; border-radius:3px; }

/* Songtitel: zuverlässiger Lauftext, der sich per JS an die Textlänge anpasst.
   Läuft nur, wenn der Titel tatsächlich zu lang für das Feld ist – sonst steht er still. */
.song-info { flex-grow:1; overflow:hidden; position: relative; min-width: 0; }
.song-info.has-fade {
  mask-image: linear-gradient(to right, transparent 0, black 22px, black calc(100% - 22px), transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 22px, black calc(100% - 22px), transparent 100%);
}
.marquee-track {
  display: flex;
  align-items: center;
  white-space: nowrap;
  width: max-content;
  will-change: transform;
}
.marquee-track.scrolling {
  animation-name: marqueeScroll;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.marquee-track:not(.scrolling) .marquee-item:first-child {
  text-overflow: ellipsis;
}
.marquee-item {
  font-size: 1.2rem;
  font-weight: 730;
  padding-right: 48px;
  box-sizing: border-box;
}
.marquee-clone { display: none; }
.marquee-track.scrolling .marquee-clone { display: inline-block; }
@keyframes marqueeScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.volume-icon { color:#fff; margin-right:8px; font-size:20px; flex-shrink: 0; cursor: pointer; }

/* Aktuelle Sendung Fenster im Player */
#current-show {
  margin-left: 20px;
  margin-right: 20px;
  background: rgba(30,30,30,0.85);
  backdrop-filter: blur(6px);
  color: #ff3b3b;
  padding: 12px 18px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  font-size: 0.95rem;
  min-width: 180px;
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  flex-shrink: 0;
}
#current-show:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
#current-show h4 { margin: 6px 0; font-size: 1rem; color: #fff; }
#current-show p { margin: 0; font-weight: 700; font-size: 1rem; color: #ff3b3b; }

/* ON AIR Label */
.on-air {
  display: inline-block;
  background: #ff1a1a;
  color: #fff;
  font-weight: bold;
  font-size: 0.85rem;
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 6px;
  animation: pulse 1.5s infinite;
  letter-spacing: 1px;
}
@keyframes pulse { 0%{box-shadow:0 0 5px rgba(255,0,0,0.7);}50%{box-shadow:0 0 20px rgba(255,0,0,1);}100%{box-shadow:0 0 5px rgba(255,0,0,0.7);} }

/* Hamburger Button nur mobil */
#hamburger { display: none; }
@media (max-width:768px){
  #hamburger {
    display: block;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1001;
    background: #8E0E0E;
    color: #fff;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 20px;
    cursor: pointer;
  }
  .sidebar { left:-250px; width:250px; }
  .sidebar.show { left:0; }
  main.content { margin-left:0; padding:15px; padding-top: 68px; margin-bottom: 134px; }

  h1 { font-size: 1.9rem; margin-bottom: 14px; }
  h2 { font-size: 1.4rem; margin-bottom: 14px; }
  h3 { font-size: 0.95rem; line-height: 1.5; margin-bottom: 26px; }

  .contact-circles { gap: 14px; margin: 24px 0; }
  .contact-circle { width: 52px; height: 52px; font-size: 22px; }

  /* === Player: eine kompakte, aufgeräumte Zeile statt zwei unruhiger Reihen ===
     Aufbau als Grid: Cover | Titel + Sendung (übereinander) | Lautstärke | Play
     Die Lautstärke bekommt auf Mobil nur einen Icon-Toggle (stumm/an), da ein
     Schieberegler auf so wenig Breite ohnehin kaum präzise bedienbar ist und
     Lautstärke auf dem Handy ganz natürlich über die Hardware-Tasten läuft. */
  footer.player {
    left:0; right:0;
    height: auto;
    display: grid;
    grid-template-columns: 52px 46px 1fr;
    grid-template-rows: auto auto;
    align-items: center;
    column-gap: 12px;
    row-gap: 1px;
    padding: 11px 14px calc(11px + env(safe-area-inset-bottom, 0px));
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.4);
  }

  /* Play/Pause: ganz links, zuerst greifbar */
  #playButton-wrapper {
    grid-column: 1;
    grid-row: 1 / 3;
    width: 52px;
    height: 52px;
    justify-self: center;
  }
  #playButton { width:52px; height:52px; font-size:22px; line-height:52px; }

  /* Lautstärke entfällt auf Mobil komplett – Pegel läuft über die Hardware-Tasten */
  #volume-wrapper { display: none; }

  /* Cover: direkt neben dem Play-Button, über beide Zeilen, mit Leuchtring beim Abspielen */
  .cover-wrapper {
    grid-column: 2;
    grid-row: 1 / 3;
    width: 46px;
    height: 46px;
    margin: 0;
    border-radius: 11px;
    transition: box-shadow 0.3s ease;
  }
  .cover-wrapper.is-logo { padding: 6px; }
  footer.player.is-playing .cover-wrapper {
    box-shadow: 0 0 0 2px rgba(255,59,59,0.55), 0 4px 14px rgba(0,0,0,0.5);
  }

  /* Songtitel: obere Zeile der rechten Spalte */
  .song-info {
    grid-column: 3;
    grid-row: 1;
    margin: 0;
    align-self: end;
    min-width: 0;
    width: 100%;
  }
  .song-info.has-fade {
    mask-image: linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
  }
  .marquee-item { font-size: 0.98rem; font-weight: 700; padding-right: 32px; }

  /* Aktuelle Sendung: untere Zeile der rechten Spalte, als schlankes Label */
  #current-show {
    grid-column: 3;
    grid-row: 2;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    min-width: 0;
    max-width: none;
    background: none;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    border-radius: 0;
    text-align: left;
    align-self: start;
  }
  #current-show:hover { transform: none; box-shadow: none; }
  #current-show h4 { display: none; }
  #current-show .on-air {
    width: 6px;
    height: 6px;
    padding: 0;
    margin-bottom: 0;
    border-radius: 50%;
    overflow: hidden;
    text-indent: -999px;
    flex-shrink: 0;
    background: #ff3b3b;
    box-shadow: 0 0 6px 1px rgba(255,59,59,0.7);
  }
  #current-show p {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #c9c9c9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
  }

  /* Der Mini-Visualizer (Punkte unter dem Button) braucht auf Mobil zu viel Platz */
  #visualizer { display: none; }

  .team-grid { grid-template-columns:1fr; gap:20px; }
  .card { padding:20px; margin:15px auto; }
}

@media (max-width: 360px) {
  .contact-circle { width: 46px; height: 46px; font-size: 19px; }
  footer.player { grid-template-columns: 48px 42px 1fr; column-gap: 9px; }
  .cover-wrapper { width: 42px; height: 42px; }
  .marquee-item { font-size: 0.9rem; }
  #current-show p { font-size: 0.7rem; }
  #playButton-wrapper { width: 48px; height: 48px; }
  #playButton { width: 48px; height: 48px; font-size: 20px; line-height: 48px; }
}

/* Header-Aktionsleiste (Wetter + Playlist), oben rechts */
.header-actions {
  position: fixed;
  top: 12px;
  right: 20px;
  z-index: 1001;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-btn {
  background-color: #8E0E0D;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: background-color 0.25s ease, transform 0.15s ease;
}
.header-btn:hover { background-color: #ff3b3b; }
.header-btn:active { transform: scale(0.96); }
#weatherButton .weather-btn-icon { font-size: 1.05rem; }
#weatherButton .weather-btn-temp { font-weight: 700; }
#weatherButton .weather-btn-place { opacity: 0.85; font-weight: 500; font-size: 0.85rem; }

/* Wetter-Popup: gleicher Aufbau wie das Playlist-Popup, eigene Inhalte */
.weather-current {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.weather-current .weather-icon-big { font-size: 3.2rem; color: #ff3b3b; transition: color 0.3s ease; }
.weather-current .weather-temp-big { font-size: 2.6rem; font-weight: 700; line-height: 1; }
.weather-current-details { text-align: left; }
.weather-current-details .weather-condition-label { font-size: 1rem; color: #fff; font-weight: 600; margin-bottom: 8px; }

/* Detailwerte (gefühlt/Feuchte/Wind/Niederschlag) mit kleinem Icon je Zeile,
   statt reinem Fließtext – macht die Werte auf einen Blick scannbar. */
.weather-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, auto);
  gap: 4px 18px;
}
.weather-detail-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  color: #ccc;
}
.weather-detail-item i { width: 16px; text-align: center; color: #ff6a6a; font-size: 0.85rem; flex-shrink: 0; }
.weather-detail-item strong { color: #fff; font-weight: 600; }

/* Sonnenauf-/untergang, eigene schmale Zeile unterhalb der aktuellen Lage */
.weather-sun-row {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 4px 0 18px;
  padding: 10px 0;
  border-top: 1px solid rgba(255,255,255,0.08);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.weather-sun-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #ccc; }
.weather-sun-item i { color: #ffb347; font-size: 1rem; }
.weather-sun-item strong { color: #fff; font-weight: 600; }

.weather-forecast-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 18px 0;
}
.weather-forecast-day {
  background: rgba(255,59,59,0.1);
  border-radius: 10px;
  padding: 10px 4px;
  text-align: center;
}
.weather-forecast-day .fc-weekday { font-size: 0.75rem; color: #ccc; text-transform: uppercase; letter-spacing: 0.03em; }
.weather-forecast-day .fc-icon { font-size: 1.3rem; margin: 6px 0; transition: color 0.3s ease; }
.weather-forecast-day .fc-max { font-weight: 700; font-size: 0.9rem; }
.weather-forecast-day .fc-min { font-size: 0.8rem; color: #999; }

/* Min/Max-Balken: zeigt die Temperaturspanne des Tages relativ zur Wochenspanne,
   damit man wärmere/kältere Tage auf einen Blick vergleichen kann, ohne Zahlen zu lesen. */
.fc-bar-track {
  position: relative;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
  margin: 6px 2px 8px;
}
.fc-bar-fill {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #5aa7ff, #ff3b3b);
}
.fc-precip { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 0.68rem; color: #7fb8ff; margin-top: 2px; }
.fc-precip i { font-size: 0.65rem; }

.weather-map-wrapper {
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  margin-top: 6px;
}
.weather-map-wrapper iframe { display: block; width: 100%; height: 220px; border: 0; }
.weather-map-link { display:inline-block; margin-top:8px; font-size:0.8rem; color:#ff3b3b; text-decoration:none; }
.weather-map-link:hover { text-decoration: underline; }
.weather-updated { font-size: 0.75rem; color: #888; margin-top: 14px; }
.weather-error { color: #ccc; font-size: 0.9rem; }

/* ===== Gemeinsame Modal-Grundstruktur (Playlist- & Wetter-Popup) =====
   Beide Popups teilen sich Overlay/Container/Close-Button; siehe createModal()
   im Script weiter unten. Individuelle Unterschiede (Breite, Fade-Effekt,
   Scroll-Verhalten) werden über Modifier-Klassen gesteuert. */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0,0,0,0.6);
  display: none;
  z-index: 1000;
}
.modal-overlay.modal-scrollable { overflow-y: auto; }
.modal-popup {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: #1e1e1e;
  color: #fff;
  padding: 30px 30px;
  border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  max-width: 480px;
  width: 90%;
  text-align: center;
}
.modal-popup.modal-popup--wide { max-width: 500px; padding: 30px 40px; }
.modal-close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  transition: color 0.2s;
}
.modal-close-btn:hover { color: #ff3b3b; }

/* Weicher Ein-/Ausblend-Übergang für Popups mit fade-Option, statt hartem display:block/none */
.modal-overlay.modal-fade { opacity: 0; transition: opacity 0.25s ease; }
.modal-overlay.modal-fade.is-visible { opacity: 1; }
.modal-overlay.modal-fade .modal-popup { transform: translate(-50%, -46%) scale(0.97); transition: transform 0.25s ease; }
.modal-overlay.modal-fade.is-visible .modal-popup { transform: translate(-50%, -50%) scale(1); }

/* Lade-Skeleton: Platzhalter-Blöcke in Form der finalen Elemente statt nur Text */
.weather-skeleton { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0 4px; }
.weather-skeleton-row { display: flex; gap: 18px; align-items: center; }
.weather-skeleton-block {
  border-radius: 8px;
  background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 37%, rgba(255,255,255,0.06) 63%);
  background-size: 400% 100%;
  animation: skeletonShine 1.4s ease-in-out infinite;
}
@keyframes skeletonShine {
  0% { background-position: 100% 0; }
  100% { background-position: 0 0; }
}

@media (max-width:768px){
  .header-actions { top: 15px; right: 12px; gap: 8px; }
  .header-btn { padding: 8px 12px; font-size: 0.82rem; gap: 6px; }
  #weatherButton .weather-btn-place { display: none; }
  .weather-current { gap: 12px; }
  .weather-current .weather-icon-big { font-size: 2.6rem; }
  .weather-current .weather-temp-big { font-size: 2.1rem; }
  .weather-forecast-row { grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .weather-forecast-day { padding: 8px 2px; }
  .weather-forecast-day .fc-weekday { font-size: 0.65rem; }
  .weather-map-wrapper iframe { height: 170px; }
  .weather-detail-grid { grid-template-columns: 1fr; gap: 6px; justify-items: start; }
  .weather-sun-row { gap: 18px; }
  .fc-precip { font-size: 0.62rem; }
}

/* Reduzierte Bewegung respektieren */
@media (prefers-reduced-motion: reduce) {
  *:not(.marquee-track):not(.marquee-track *), *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .reveal-init { opacity: 1 !important; transform: none !important; }
}

<script>

        document.body.appendChild(snowflake);

        setTimeout(() => snowflake.remove(), 8000);

<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

<script>
// Audio Player
const streamUrl='https://stream.laut.fm/radioms990';
const playButtonWrapper=document.getElementById('playButton-wrapper');
const playButton=document.getElementById('playButton');
const playButtonIcon=document.getElementById('playButtonIcon');
const volumeSlider=document.getElementById('volume');
const currentSongSpan=document.getElementById('current-song');
const currentSongClone=document.getElementById('current-song-clone');
const marqueeTrack=document.getElementById('marqueeTrack');
const songInfoBox=document.querySelector('.song-info');
const currentShowTitle=document.getElementById("current-show-title");
const coverImage=document.getElementById('cover-image');
const coverWrapper=document.querySelector('.cover-wrapper');
const logoFallback='img/RMC20250918-2.png';
let lastSongKey='';
let lastMarqueeText='';
let coverRequestId=0;
let lastMediaTitle='Radio Multicraft';
let lastMediaArtist='Dein Sound | Dein Stream';

// Lädt das Sendelogo einmalig vor, damit es beim Zusammensetzen der
// Media-Session-Artwork sofort zur Verfügung steht.
let stationLogoReady = null;
function getStationLogoImage(){
  if(!stationLogoReady){
    stationLogoReady = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = logoFallback;
    });
  }
  return stationLogoReady;
}

// Baut aus Songcover + Sendelogo ein einziges Bild zusammen (Logo als kleines
// rundes Badge unten rechts), damit im Sperrbildschirm/Auto-Display sowohl
// das Songcover als auch "Radio Multicraft" sichtbar sind. Falls das Cover
// von einer Quelle ohne CORS-Freigabe kommt, wird das Canvas "verunreinigt"
// und wir fallen sauber auf das reine Cover ohne Badge zurück.
async function buildArtworkWithLogo(coverUrl){
  if(!coverUrl || coverUrl.includes('RMC20250918-2.png')) return logoFallback;
  try{
    const logoImg = await getStationLogoImage();
    const coverImg = await new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = coverUrl;
    });
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(coverImg, 0, 0, size, size);
    if(logoImg){
      const badgeSize = size * 0.3;
      const margin = size * 0.035;
      const bx = size - badgeSize - margin;
      const by = size - badgeSize - margin;
      ctx.beginPath();
      ctx.arc(bx + badgeSize/2, by + badgeSize/2, badgeSize/2 + 8, 0, Math.PI*2);
      ctx.fillStyle = '#8E0E0E';
      ctx.fill();
      ctx.drawImage(logoImg, bx, by, badgeSize, badgeSize);
    }
    return canvas.toDataURL('image/png');
  }catch(e){
    return coverUrl;
  }
}

// Media Session: liefert Titel/Interpret/Cover (inkl. Sendelogo-Badge) an
// Sperrbildschirm, Benachrichtigungen und – wo vom System unterstützt –
// Android Auto/CarPlay, inklusive Play/Pause-Steuerung direkt von dort aus.
async function updateMediaSessionMetadata(artworkUrl){
  if(!('mediaSession' in navigator)) return;
  const finalArtwork = await buildArtworkWithLogo(artworkUrl || logoFallback);
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: lastMediaTitle,
      artist: lastMediaArtist,
      album: 'Radio Multicraft',
      artwork: [
        { src: finalArtwork, sizes: '512x512', type: 'image/png' }
      ]
    });
  }catch(e){
    // Falls MediaMetadata auf diesem Gerät/Browser nicht sauber unterstützt
    // wird, soll das den restlichen Player (Titelanzeige, Cover, Laufschrift)
    // nicht beeinträchtigen.
  }
}

function setCoverImage(url, isLogo){
  coverImage.src = url;
  coverWrapper.classList.toggle('is-logo', !!isLogo);
  updateMediaSessionMetadata(url);
}

// Sucht bei iTunes ein Coverbild anhand von Interpret + Titel,
// falls laut.fm selbst kein Bild liefert.
async function resolveCoverViaItunes(artist, title){
  const myRequestId = ++coverRequestId;
  try{
    const query = encodeURIComponent(`${artist||''} ${title||''}`.trim());
    if(!query){ if(myRequestId===coverRequestId) setCoverImage(logoFallback, true); return; }
    const res = await fetch(`https://itunes.apple.com/search?term=${query}&media=music&limit=1`);
    const json = await res.json();
    const artwork = json.results?.[0]?.artworkUrl100;
    if(myRequestId!==coverRequestId) return; // Song hat sich in der Zwischenzeit schon wieder geändert
    if(artwork){
      setCoverImage(artwork.replace('100x100bb','600x600bb'), false);
    } else {
      setCoverImage(logoFallback, true);
    }
  }catch(e){
    if(myRequestId===coverRequestId) setCoverImage(logoFallback, true);
  }
}

function updateCoverForSong(artist, title, lautfmImage){
  coverRequestId++; // laufende iTunes-Anfragen für den alten Song verwerfen
  if(lautfmImage){
    setCoverImage(lautfmImage, false);
    return;
  }
  if(!artist && !title){
    setCoverImage(logoFallback, true);
    return;
  }
  resolveCoverViaItunes(artist, title);
}
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Lauftext für den Songtitel: läuft nur, wenn der Titel wirklich zu lang für
// das Feld ist, und dessen Geschwindigkeit sich an die Textlänge anpasst,
// damit auch sehr lange Titel vollständig lesbar durchlaufen.
const MARQUEE_SPEED_PX_PER_SEC = 55;
const MARQUEE_MIN_DURATION = 6;
let marqueeResizeTimeout = null;

function updateMarqueeState(){
  marqueeTrack.classList.remove('scrolling');
  marqueeTrack.style.animationDuration = '';
  songInfoBox.classList.remove('has-fade');
  currentSongClone.textContent = currentSongSpan.textContent;

  // Doppeltes rAF: erst nach dem zweiten Frame ist das Grid-Layout
  // (v.a. die 1fr-Spalte im mobilen Player) garantiert final berechnet,
  // sonst wird auf Mobil teils gegen eine noch nicht fertige Breite gemessen.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const itemWidth = currentSongSpan.scrollWidth;
      const containerWidth = songInfoBox.clientWidth;
      // Die Songtitel-Laufschrift läuft bewusst unabhängig von der
      // "Bewegung reduzieren"-Einstellung, damit jeder Nutzer den vollständigen
      // Titel sehen kann, egal auf welchem Gerät/Browser er unterwegs ist.
      if(itemWidth > containerWidth){
        const duration = Math.max(itemWidth / MARQUEE_SPEED_PX_PER_SEC, MARQUEE_MIN_DURATION);
        marqueeTrack.style.animationDuration = duration + 's';
        marqueeTrack.classList.add('scrolling');
        songInfoBox.classList.add('has-fade');
      }
    });
  });
}

const marqueeObserver = new ResizeObserver(() => {
  clearTimeout(marqueeResizeTimeout);
  marqueeResizeTimeout = setTimeout(updateMarqueeState, 150);
});
marqueeObserver.observe(songInfoBox);

// Nach dem Laden der Schrift erneut prüfen, da sich Textbreiten dadurch
// nachträglich verschieben können (relevant für die Lauftext-Berechnung).
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateMarqueeState);
}

// Pinch-to-Zoom auf dem Handy: die eigentliche Layout-Breite ändert sich dabei
// nicht (window.resize feuert nicht), aber mobile Browser pausieren laufende
// CSS-Animationen während/kurz nach einer aktiven Zoom-Geste oft aus
// Performance-Gründen. Die Laufschrift kann dadurch mitten im Lauf "einfrieren"
// und wirkt dann so, als wäre der Titel abgeschnitten. Die visualViewport-API
// feuert speziell bei Zoom-Änderungen (anders als das normale resize-Event) –
// wir nutzen das, um die Animation danach sauber neu zu starten.
if(window.visualViewport){
  let zoomRestartTimeout = null;
  window.visualViewport.addEventListener('resize', () => {
    clearTimeout(zoomRestartTimeout);
    zoomRestartTimeout = setTimeout(updateMarqueeState, 250);
  });
}

const sound=new Howl({
  src:[streamUrl],
  html5:true,
  format:['mp3'],
  volume:0.5
});

playButton.addEventListener('click',()=>{sound.playing()?sound.pause():sound.play();});
function syncVolumeFill(){ volumeSlider.style.setProperty('--vol', (volumeSlider.value*100)+'%'); }
volumeSlider.addEventListener('input',()=>{sound.volume(volumeSlider.value); syncVolumeFill(); syncVolumeIcon();});
syncVolumeFill();

// Lautstärke-Icon: auf Mobil ersetzt es den Schieberegler als kompakter
// Stumm/An-Schalter, auf Desktop zeigt es zusätzlich den aktuellen Pegel an.
const volumeIcon = document.getElementById('volumeIcon');
let lastVolume = parseFloat(volumeSlider.value) || 0.5;
function syncVolumeIcon(){
  const vol = parseFloat(volumeSlider.value);
  volumeIcon.classList.toggle('is-muted', vol <= 0);
  volumeIcon.classList.remove('fa-volume-up','fa-volume-down','fa-volume-mute');
  if(vol <= 0) volumeIcon.classList.add('fa-volume-mute');
  else if(vol < 0.5) volumeIcon.classList.add('fa-volume-down');
  else volumeIcon.classList.add('fa-volume-up');
}
function toggleMute(){
  const vol = parseFloat(volumeSlider.value);
  if(vol > 0){
    lastVolume = vol;
    volumeSlider.value = 0;
  } else {
    volumeSlider.value = lastVolume > 0 ? lastVolume : 0.5;
  }
  sound.volume(parseFloat(volumeSlider.value));
  syncVolumeFill();
  syncVolumeIcon();
}
volumeIcon.addEventListener('click', toggleMute);
volumeIcon.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleMute(); }
});
syncVolumeIcon();

// Play/Pause immer weiß
const footerPlayer = document.querySelector('footer.player');

// Media Session: Play/Pause-Steuerung, die vom Sperrbildschirm, aus
// Benachrichtigungen oder von Android Auto/CarPlay aus ausgelöst werden kann.
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', () => sound.play());
  navigator.mediaSession.setActionHandler('pause', () => sound.pause());
  navigator.mediaSession.setActionHandler('stop', () => sound.pause());
  updateMediaSessionMetadata(coverImage.src);
}

sound.on('play', () => {
  playButtonIcon.className = 'fas fa-pause';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
  playButton.classList.add('is-playing');
  playButtonWrapper.classList.add('is-playing');
  footerPlayer.classList.add('is-playing');
  if('mediaSession' in navigator){
    navigator.mediaSession.playbackState = 'playing';
    // Metadaten genau im Moment des echten Play-Starts nochmal frisch setzen –
    // einige Android-Versionen "fotografieren" die Metadaten für das
    // Sperrbildschirm-Widget exakt zu diesem Zeitpunkt.
    updateMediaSessionMetadata(coverImage.src);
  }
});
sound.on('pause', () => {
  playButtonIcon.className = 'fas fa-play';
  playButton.style.color = "#fff";
  playButton.style.backgroundColor = "#ff3b3b";
  playButton.classList.remove('is-playing');
  playButtonWrapper.classList.remove('is-playing');
  footerPlayer.classList.remove('is-playing');
  if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
sound.on('loaderror', () => {
  playButtonIcon.className = 'fas fa-play';
  playButton.classList.remove('is-playing');
  playButtonWrapper.classList.remove('is-playing');
  const previousShow = currentShowTitle.textContent;
  currentShowTitle.textContent = '⚠ Stream nicht erreichbar';
  setTimeout(() => { currentShowTitle.textContent = previousShow; }, 5000);
});
sound.on('playerror', () => {
  playButtonIcon.className = 'fas fa-play';
  playButton.classList.remove('is-playing');
  playButtonWrapper.classList.remove('is-playing');
  const previousShow = currentShowTitle.textContent;
  currentShowTitle.textContent = '⚠ Verbindung unterbrochen';
  setTimeout(() => { currentShowTitle.textContent = previousShow; }, 5000);
});

// Song Title
async function fetchCurrentSong(retry=false){
try{
const response=await fetch('https://api.laut.fm/station/radioms990/current_song?_='+Date.now());
const data=await response.json();
const artist=data.artist?.name?.trim();
const title=data.title?.trim();
const hasValidArtist=artist && !/^-+$/.test(artist);
if(hasValidArtist && title){currentSongSpan.textContent=`${artist} - ${title}`;}
else if(title){currentSongSpan.textContent=title;}
else{if(!retry){setTimeout(()=>fetchCurrentSong(true),1000);}else{currentSongSpan.textContent="Dein Sound | Dein Stream";}}

// Media Session mit dem neuen Titel/Interpret aktualisieren (Cover-URL bleibt
// vorerst wie gehabt, bis updateCoverForSong sie unten ggf. neu auflöst).
lastMediaTitle = title || 'Radio Multicraft';
lastMediaArtist = hasValidArtist ? artist : 'Dein Sound | Dein Stream';

}

  if(currentSongSpan.textContent !== lastMarqueeText){

}

// ===== Starnews: lädt die Meldungen automatisch aus news.json =====
// Damit reicht es, news.json auf dem Server auszutauschen (z.B. erzeugt über
// news-editor.html) - an der index.html muss dafür nichts mehr geändert werden.
// Fallback: Falls news.json nicht geladen werden kann (z.B. beim lokalen Testen
// direkt per Doppelklick auf die Datei, ohne echten Server - dort blockieren
// Browser das Nachladen von Dateien aus Sicherheitsgründen), werden ein paar
// Standard-Meldungen angezeigt, damit die Seite trotzdem nie leer bleibt.
const STARNEWS_FALLBACK = [
  {
    image: 'img/RMC20250918-2.png',
    title: 'Meldungen konnten nicht geladen werden',
    paragraphs: [
      'news.json konnte nicht gefunden oder gelesen werden. Falls du die Seite gerade lokal per Doppelklick testest: das ist normal, das Nachladen von Dateien funktioniert nur über einen echten Webserver (also z.B. direkt auf radiomulticraft.de).'
    ]
  }
];

// Merkt sich den zuletzt geladenen news.json-Inhalt als Text, damit beim
// automatischen Nachprüfen (Polling, siehe weiter unten) nur dann neu
// gerendert wird, wenn sich wirklich etwas geändert hat.
let lastNewsRaw = null;

async function loadStarnews(isPoll = false){
  const container = document.getElementById('starnews-container');
  if(!container) return; // Container nur auf der Startseite vorhanden
  try{
    const res = await fetch('news.json?_=' + Date.now());
    if(!res.ok) throw new Error('news.json nicht erreichbar');
    const raw = await res.text();

    // Beim automatischen Nachprüfen: nichts tun, wenn sich der Inhalt seit
    // dem letzten Laden nicht verändert hat - so flackert für Zuhörer:innen,
    // die die Seite gerade offen haben, nichts unnötig.
    if(isPoll && raw === lastNewsRaw) return;
    lastNewsRaw = raw;

    const items = JSON.parse(raw);
    renderStarnewsInto(container, Array.isArray(items) && items.length ? items : STARNEWS_FALLBACK);
  }catch(e){
    if(!isPoll) renderStarnewsInto(container, STARNEWS_FALLBACK);
  }
  // Neu eingefügte Meldungen brauchen ihre eigene Scroll-Reveal-Beobachtung,
  // da sie erst nach initScrollReveal() ins DOM kommen.
  initScrollReveal();
}

function renderStarnewsInto(container, items){
  container.innerHTML = items.map(item => `
<article class="news-article">
<img src="${item.image}" alt="News" class="centered-banner" loading="lazy">
<h2>${item.title}</h2>
${(item.paragraphs || []).map(p => `<p>${p}</p>`).join('\n')}
</article>`).join('\n');
}

// Prüft alle 90 Sekunden automatisch, ob sich news.json geändert hat, und
// aktualisiert die Meldungen dann direkt - ohne dass Zuhörer:innen, die
// gerade auf der Seite sind, die Seite neu laden müssen. Läuft nur, solange
// die Startseite (mit dem #starnews-container) auch tatsächlich offen ist.
const NEWS_POLL_MS = 90 * 1000;
setInterval(() => {
  if(document.getElementById('starnews-container')) loadStarnews(true);
}, NEWS_POLL_MS);

function loadPage(page){

    content.innerHTML = pages[page];
    window.scrollTo({top:0, behavior:"auto"});

  content.style.opacity = 0;

    content.innerHTML = pages[page];

    if(page === 'home') loadStarnews();
  }, 180);
}

// Scroll-Reveal: Karten, Banner & Team-Kacheln gleiten beim Scrollen sanft ins Bild
let revealObserver = null;
function initScrollReveal(){
  if(prefersReducedMotion) return;
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('revealed');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  const revealTargets = content.querySelectorAll('.card, .centered-banner, .team-member, .news-article');
  revealTargets.forEach(el=>{
    el.classList.add('reveal-init');
    revealObserver.observe(el);
  });
}

// Registry aller über createModal() erzeugten Popups. Wird genutzt, damit
// beim Öffnen eines Popups automatisch jedes andere offene Popup zuerst
// geschlossen wird – so können sich Playlist- und Wetter-Popup nie mehr
// überlappen, egal in welcher Reihenfolge sie angeklickt werden.
const openModals = [];

// Gemeinsame Modal-Grundstruktur für Playlist- und Wetter-Popup: erzeugt
// Overlay, Popup-Container und Close-Button und verdrahtet das Schließen
// (Klick auf Close-Button oder auf den dunklen Hintergrund). Optional mit
// weichem Fade-Übergang (siehe .modal-fade in CSS) statt hartem display:block/none.
function createModal({ wide = false, fade = false, scrollable = false } = {}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'
    + (fade ? ' modal-fade' : '')
    + (scrollable ? ' modal-scrollable' : '');
  document.body.appendChild(overlay);

  const popup = document.createElement('div');
  popup.className = 'modal-popup' + (wide ? ' modal-popup--wide' : '');
  overlay.appendChild(popup);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close-btn';
  closeBtn.textContent = '✖';
  popup.appendChild(closeBtn);

  const modal = { overlay, popup, closeBtn };

  function open(){
    // Andere offene Popups zuerst schließen, damit sich nie zwei gleichzeitig
    // überlappen (z.B. Wetter offen lassen und dann Playlist anklicken).
    openModals.forEach(other => { if(other !== modal) other.close(); });

    overlay.style.display = 'block';
    if(fade){
      // Erst nach dem Setzen von display:block einen Frame warten, damit die
      // CSS-Transition (opacity/transform) beim Einblenden greift statt zu springen.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => overlay.classList.add('is-visible'));
      });
    }
  }
  function close(){
    if(fade){
      // Erst die Übergangsklasse entfernen (Fade+Scale läuft), erst danach
      // display:none setzen, damit die Transition sichtbar ist.
      overlay.classList.remove('is-visible');
      setTimeout(() => { overlay.style.display = 'none'; }, 250);
    } else {
      overlay.style.display = 'none';
    }
  }

  modal.open = open;
  modal.close = close;
  openModals.push(modal);

  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });

  return modal;
}


const { overlay: playlistOverlay, popup: playlistPopup, closeBtn, open: openPlaylistModal } = createModal({ wide: true });

// Wandelt das laut.fm-Zeitformat ("2026-07-17 09:11:56 +0200") in ein
// gültiges Date-Objekt um, damit es browserübergreifend zuverlässig geparst wird.
function parseLautDate(str){
  if(!str) return null;
  const m = str.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}) ([+-]\d{2})(\d{2})$/);
  if(!m) return new Date(str);
  return new Date(`${m[1]}T${m[2]}${m[3]}:${m[4]}`);
}

// Erzeugt eine kurze relative Zeitangabe ("gerade eben", "vor 5 Minuten", ...)
// aus dem started_at-Zeitstempel eines Songs.
function formatRelativeTime(dateStr){
  const date = parseLautDate(dateStr);
  if(!date || isNaN(date.getTime())) return '';
  const diffMin = Math.round((Date.now() - date.getTime()) / 60000);
  if(diffMin <= 0) return 'jetzt';
  if(diffMin === 1) return 'vor 1 Minute';
  if(diffMin < 60) return `vor ${diffMin} Minuten`;
  const diffH = Math.round(diffMin / 60);
  if(diffH === 1) return 'vor 1 Stunde';
  return `vor ${diffH} Stunden`;
}

async function loadLastSongs() {

            playlistPopup.innerHTML += '<p>Keine Songs verfügbar</p>';
            playlistPopup.appendChild(closeBtn);
            return;
        }

        const songContainer = document.createElement('div');
        songContainer.style.display = 'grid';
        songContainer.style.gridTemplateColumns = '1fr';
        songContainer.style.gap = '12px';

        data.slice(0, 10).forEach(song => {
    const card = document.createElement('div');
    card.style.background = 'rgba(255,59,59,0.1)';
    card.style.padding = '12px 15px';
    card.style.borderRadius = '10px';
    card.style.display = 'flex';
    card.style.alignItems = 'center';
    card.style.justifyContent = 'space-between';
    card.style.gap = '12px';
    card.style.transition = 'transform 0.2s, box-shadow 0.2s';
    card.style.cursor = 'default';

    card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-3px)';
        card.style.boxShadow = '0 6px 15px rgba(255,59,59,0.4)';
    });
    card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0)';
        card.style.boxShadow = 'none';
    });

    const songText = document.createElement('span');
    const songArtist = song.artist?.name?.trim();
    const songTitle = song.title?.trim();
    const songHasValidArtist = songArtist && !/^-+$/.test(songArtist);
    songText.textContent = songHasValidArtist && songTitle ? `${songArtist} - ${songTitle}` : (songTitle || 'Dein Sound | Dein Stream');
    songText.style.fontWeight = '600';
    songText.style.textAlign = 'left';

    const songTime = document.createElement('span');
    songTime.textContent = formatRelativeTime(song.started_at);
    songTime.style.fontSize = '0.8rem';
    songTime.style.color = '#c9c9c9';
    songTime.style.flexShrink = '0';
    songTime.style.whiteSpace = 'nowrap';

    card.appendChild(songText); // Musik-Icon entfernt
    card.appendChild(songTime);
    songContainer.appendChild(card);
});

        playlistPopup.appendChild(songContainer);
    } catch (e) {
        playlistPopup.innerHTML += '<p>Fehler beim Laden</p>';
        playlistPopup.appendChild(closeBtn);
    }
}

// ===== Wetter (Aachen) =====================================================
// Datenquelle: Open-Meteo – kostenlos, kein API-Key nötig, direkt per fetch()
// aus dem Browser abrufbar (ähnlich wie die laut.fm-Anfragen oben).
const AACHEN_LAT = 50.7753;
const AACHEN_LON = 6.0839;
const WEATHER_REFRESH_MS = 15 * 60 * 1000; // alle 15 Minuten reicht für Wetterdaten

// WMO-Wettercode → Icon (Font Awesome, bereits auf der Seite geladen) + deutsches Label.
// Quelle der Codes: Open-Meteo-Dokumentation (WMO Weather interpretation codes).
function getWeatherInfo(code, isDay){
  const table = {
    0:  { icon: isDay ? 'fa-sun' : 'fa-moon', label: 'Klarer Himmel', color: isDay ? '#ffb347' : '#8ea3c9' },
    1:  { icon: isDay ? 'fa-cloud-sun' : 'fa-cloud-moon', label: 'Überwiegend klar', color: isDay ? '#ffb347' : '#8ea3c9' },
    2:  { icon: isDay ? 'fa-cloud-sun' : 'fa-cloud-moon', label: 'Teilweise bewölkt', color: '#c9c9c9' },
    3:  { icon: 'fa-cloud', label: 'Bedeckt', color: '#9a9a9a' },
    45: { icon: 'fa-smog', label: 'Nebel', color: '#9a9a9a' },
    48: { icon: 'fa-smog', label: 'Reifnebel', color: '#9a9a9a' },
    51: { icon: 'fa-cloud-rain', label: 'Leichter Nieselregen', color: '#5aa7ff' },
    53: { icon: 'fa-cloud-rain', label: 'Nieselregen', color: '#5aa7ff' },
    55: { icon: 'fa-cloud-rain', label: 'Starker Nieselregen', color: '#5aa7ff' },
    56: { icon: 'fa-cloud-rain', label: 'Gefrierender Nieselregen', color: '#5aa7ff' },
    57: { icon: 'fa-cloud-rain', label: 'Starker gefrierender Nieselregen', color: '#5aa7ff' },
    61: { icon: 'fa-cloud-rain', label: 'Leichter Regen', color: '#4090ff' },
    63: { icon: 'fa-cloud-rain', label: 'Regen', color: '#4090ff' },
    65: { icon: 'fa-cloud-showers-heavy', label: 'Starker Regen', color: '#2e6fe0' },
    66: { icon: 'fa-cloud-rain', label: 'Gefrierender Regen', color: '#4090ff' },
    67: { icon: 'fa-cloud-showers-heavy', label: 'Starker gefrierender Regen', color: '#2e6fe0' },
    71: { icon: 'fa-snowflake', label: 'Leichter Schneefall', color: '#bcdcff' },
    73: { icon: 'fa-snowflake', label: 'Schneefall', color: '#bcdcff' },
    75: { icon: 'fa-snowflake', label: 'Starker Schneefall', color: '#bcdcff' },
    77: { icon: 'fa-snowflake', label: 'Schneegriesel', color: '#bcdcff' },
    80: { icon: 'fa-cloud-showers-heavy', label: 'Leichte Regenschauer', color: '#4090ff' },
    81: { icon: 'fa-cloud-showers-heavy', label: 'Regenschauer', color: '#4090ff' },
    82: { icon: 'fa-cloud-showers-heavy', label: 'Heftige Regenschauer', color: '#2e6fe0' },
    85: { icon: 'fa-snowflake', label: 'Leichte Schneeschauer', color: '#bcdcff' },
    86: { icon: 'fa-snowflake', label: 'Schneeschauer', color: '#bcdcff' },
    95: { icon: 'fa-bolt', label: 'Gewitter', color: '#c58bff' },
    96: { icon: 'fa-bolt', label: 'Gewitter mit Hagel', color: '#c58bff' },
    99: { icon: 'fa-bolt', label: 'Starkes Gewitter mit Hagel', color: '#c58bff' }
  };
  return table[code] || { icon: 'fa-cloud', label: 'Unbekannt', color: '#ff3b3b' };
}

const WEEKDAYS_SHORT = ['So','Mo','Di','Mi','Do','Fr','Sa'];

// Wetter-Popup (gleicher Modal-Aufbau wie das Playlist-Popup, eigener Inhalt;
// zusätzlich mit weichem Fade-Übergang und Scroll-Fähigkeit für lange Inhalte)
const { overlay: weatherOverlay, popup: weatherPopup, closeBtn: weatherCloseBtn, open: openWeatherModal, close: closeWeatherPopup } = createModal({ fade: true, scrollable: true });

let weatherLastData = null;

// Platzhalter-Layout in Form der finalen Elemente, statt nur "Lade..."-Text –
// wirkt beim ersten Öffnen deutlich hochwertiger.
function renderWeatherSkeleton(){
  weatherPopup.innerHTML = '<h2 style="color:#ff3b3b; margin-bottom:6px;">Wetter in Aachen</h2>';
  weatherPopup.appendChild(weatherCloseBtn);
  const skeleton = document.createElement('div');
  skeleton.className = 'weather-skeleton';
  skeleton.innerHTML = `
    <div class="weather-skeleton-row">
      <div class="weather-skeleton-block" style="width:56px; height:56px; border-radius:50%;"></div>
      <div class="weather-skeleton-block" style="width:80px; height:40px;"></div>
    </div>
    <div class="weather-skeleton-block" style="width:220px; height:14px;"></div>
    <div class="weather-skeleton-row">
      <div class="weather-skeleton-block" style="width:60px; height:60px; border-radius:10px;"></div>
      <div class="weather-skeleton-block" style="width:60px; height:60px; border-radius:10px;"></div>
      <div class="weather-skeleton-block" style="width:60px; height:60px; border-radius:10px;"></div>
      <div class="weather-skeleton-block" style="width:60px; height:60px; border-radius:10px;"></div>
      <div class="weather-skeleton-block" style="width:60px; height:60px; border-radius:10px;"></div>
    </div>
  `;
  weatherPopup.appendChild(skeleton);
}

// Kurzes HH:MM aus einem ISO-Zeitstempel wie "2026-07-22T06:03" extrahieren,
// für die Sonnenauf-/untergang-Anzeige.
function formatSunTime(isoStr){
  if(!isoStr) return '--:--';
  const parts = isoStr.split('T');
  return parts.length > 1 ? parts[1] : '--:--';
}

function renderWeatherPopup(data){
  weatherPopup.innerHTML = '<h2 style="color:#ff3b3b; margin-bottom:6px;">Wetter in Aachen</h2>';
  weatherPopup.appendChild(weatherCloseBtn);

  if(!data){
    const err = document.createElement('p');
    err.className = 'weather-error';
    err.textContent = 'Wetterdaten konnten gerade nicht geladen werden.';
    weatherPopup.appendChild(err);
    return;
  }

  const cur = data.current;
  const info = getWeatherInfo(cur.weather_code, cur.is_day === 1);

  // Aktuelle Lage
  const currentBlock = document.createElement('div');
  currentBlock.className = 'weather-current';
  currentBlock.innerHTML = `
    <i class="fas ${info.icon} weather-icon-big" style="color:${info.color};"></i>
    <div class="weather-temp-big">${Math.round(cur.temperature_2m)}°C</div>
    <div class="weather-current-details">
      <div class="weather-condition-label">${info.label}</div>
      <div class="weather-detail-grid">
        <div class="weather-detail-item"><i class="fas fa-temperature-half"></i>Gefühlt <strong>${Math.round(cur.apparent_temperature)}°C</strong></div>
        <div class="weather-detail-item"><i class="fas fa-droplet"></i>Feuchte <strong>${Math.round(cur.relative_humidity_2m)}%</strong></div>
        <div class="weather-detail-item"><i class="fas fa-wind"></i>Wind <strong>${Math.round(cur.wind_speed_10m)} km/h</strong></div>
      </div>
    </div>
  `;
  weatherPopup.appendChild(currentBlock);

  // Sonnenauf-/untergang von heute
  const daily = data.daily;
  if(daily.sunrise && daily.sunset){
    const sunRow = document.createElement('div');
    sunRow.className = 'weather-sun-row';
    sunRow.innerHTML = `
      <div class="weather-sun-item"><i class="fas fa-arrow-up"></i>Aufgang <strong>${formatSunTime(daily.sunrise[0])}</strong></div>
      <div class="weather-sun-item"><i class="fas fa-arrow-down"></i>Untergang <strong>${formatSunTime(daily.sunset[0])}</strong></div>
    `;
    weatherPopup.appendChild(sunRow);
  }

  // 5-Tage-Vorschau inkl. Min/Max-Balken (Spanne relativ zur Wochenspanne) und Regenwahrscheinlichkeit
  const forecastRow = document.createElement('div');
  forecastRow.className = 'weather-forecast-row';
  const dayCount = Math.min(5, daily.time.length);
  const weekMin = Math.min(...daily.temperature_2m_min.slice(0, dayCount));
  const weekMax = Math.max(...daily.temperature_2m_max.slice(0, dayCount));
  const weekSpan = Math.max(weekMax - weekMin, 1);
  for(let i = 0; i < dayCount; i++){
    const d = new Date(daily.time[i] + 'T12:00:00');
    const dayInfo = getWeatherInfo(daily.weather_code[i], true);
    const dayMin = daily.temperature_2m_min[i];
    const dayMax = daily.temperature_2m_max[i];
    const barLeft = ((dayMin - weekMin) / weekSpan) * 100;
    const barWidth = Math.max(((dayMax - dayMin) / weekSpan) * 100, 8);
    const precip = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
    const dayEl = document.createElement('div');
    dayEl.className = 'weather-forecast-day';
    dayEl.innerHTML = `
      <div class="fc-weekday">${i === 0 ? 'Heute' : WEEKDAYS_SHORT[d.getDay()]}</div>
      <i class="fas ${dayInfo.icon} fc-icon" style="color:${dayInfo.color};"></i>
      <div class="fc-max">${Math.round(dayMax)}°</div>
      <div class="fc-bar-track"><div class="fc-bar-fill" style="left:${barLeft}%; width:${barWidth}%;"></div></div>
      <div class="fc-min">${Math.round(dayMin)}°</div>
      ${precip !== null ? `<div class="fc-precip"><i class="fas fa-droplet"></i>${Math.round(precip)}%</div>` : ''}
    `;
    forecastRow.appendChild(dayEl);
  }
  weatherPopup.appendChild(forecastRow);

  // Karte (OpenStreetMap, kein API-Key nötig)
  const mapWrapper = document.createElement('div');
  mapWrapper.className = 'weather-map-wrapper';
  const bbox = '5.98,50.72,6.19,50.83';
  const marker = `${AACHEN_LAT},${AACHEN_LON}`;
  mapWrapper.innerHTML = `<iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${marker}" title="Karte Aachen"></iframe>`;
  weatherPopup.appendChild(mapWrapper);

  const mapLink = document.createElement('a');
  mapLink.className = 'weather-map-link';
  mapLink.href = `https://www.openstreetmap.org/?mlat=${AACHEN_LAT}&mlon=${AACHEN_LON}#map=12/${AACHEN_LAT}/${AACHEN_LON}`;
  mapLink.target = '_blank';
  mapLink.rel = 'noopener noreferrer';
  mapLink.textContent = 'Größere Karte öffnen';
  weatherPopup.appendChild(mapLink);

  const updated = document.createElement('p');
  updated.className = 'weather-updated';
  const now = new Date();
  updated.textContent = `Aktualisiert um ${now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr · Daten: Open-Meteo`;
  weatherPopup.appendChild(updated);
}

async function fetchWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${AACHEN_LAT}&longitude=${AACHEN_LON}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset` +
      `&timezone=Europe%2FBerlin&forecast_days=5`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Wetter-API nicht erreichbar');
    const data = await res.json();
    weatherLastData = data;

    // Button-Anzeige (Icon + Temperatur) aktualisieren
    const info = getWeatherInfo(data.current.weather_code, data.current.is_day === 1);
    const btnIcon = weatherButton.querySelector('.weather-btn-icon');
    btnIcon.className = `fas ${info.icon} weather-btn-icon`;
    btnIcon.style.color = info.color;
    weatherButton.querySelector('.weather-btn-temp').textContent = `${Math.round(data.current.temperature_2m)}°`;

    // Falls das Popup gerade offen ist, gleich mit aktualisieren
    if(weatherOverlay.style.display === 'block'){
      renderWeatherPopup(data);
    }
  }catch(e){
    weatherButton.querySelector('.weather-btn-icon').className = 'fas fa-cloud weather-btn-icon';
    weatherButton.querySelector('.weather-btn-temp').textContent = '--°';
    if(weatherOverlay.style.display === 'block' && !weatherLastData){
      renderWeatherPopup(null);
    }
  }
}

weatherButton.addEventListener('click', () => {
  if(weatherLastData){
    renderWeatherPopup(weatherLastData); // sofort zeigen, was wir schon haben
  } else {
    renderWeatherSkeleton(); // beim allerersten Öffnen: Platzhalter-Layout statt nur Text
  }
  openWeatherModal();
  fetchWeather();
});

fetchWeather();
setInterval(fetchWeather, WEATHER_REFRESH_MS);

</script>
</body>
</html>
